    - "analyze SYMBOL fundamentals"
    - "valuation of SYMBOL"
    - "financial health SYMBOL"
    - "earnings quality SYMBOL"
    - "research SYMBOL"
    - "SYMBOL investment thesis"
    - "fair value SYMBOL"
    - "SYMBOL balance sheet"
  cli: "python nse_agent.py --query \"fundamental analysis SYMBOL\""
