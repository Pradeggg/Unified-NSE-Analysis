    Must run AFTER sector_rotation_tracker.py --snapshot (Step 4B) and BEFORE
    top_picks_report.py. Without this, no pick receives a vcp+sector tag.
  category: workflow
  tags: [vcp, breakout, picks, stage2, materialize, portfolio]
  input_patterns:
    - "materialize vcp picks"
    - "vcp breakout candidates"
    - "top picks report"
    - "stage 2 vcp"
    - "run vcp materialiser"
  cli: "python scripts/materialize_stage2_vcp_picks.py --lookback-days 365"
  when_to_use: "After stage snapshot (4B), before top_picks_report.py — part of daily pipeline Phase 2C"
  ordering_rules:
    - "Must run after: sector_rotation_tracker.py --snapshot"
    - "Must run before: python top_picks_report.py"
  source_file_tokens: 1800

