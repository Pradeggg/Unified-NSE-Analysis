id: workflow_generate_research_report
title: "Generate Research Report — Agent Adda Template Renderer"
description: >
  Fill the Agent Adda deep-research HTML template
  (reports/fundamental/templates/agent_adda_deep_research_template.html)
  with live data from PostgreSQL, Screener.in, and injected Claude WebSearch
  results. Outputs a full-design branded dark-theme HTML to
  reports/fundamental/{symbol}_{date}.html. Covers 51 placeholders across
  every section: KPI cards, score bars, quarterly table, balance sheet, cash
  flow, concall highlights, broker table, valuation scenarios, risk grid, and
  evidence trail. Automatically swaps agentadda.in font CDN to Google Fonts.
category: workflow
tags: [research_report, template, fundamental, company_story, html, dark_theme,
       score_bars, quarterly, balance_sheet, broker, valuation, risk, evidence_trail,
       google_fonts, weinstein, agent_adda_template, generate, 51_placeholders]
input_patterns:
  - "generate research report"
  - "fill research template"
  - "agent adda template"
  - "build research report"
  - "deep research report"
  - "research html report"
  - "comprehensive report like ltfoods"
  - "agent adda dark theme report"
  - "company report with template"
  - "fundamental report html"
cli: "python scripts/generate_research_report.py SYMBOL --open"
when_to_use: >
  When you need a publication-quality HTML research report matching the Agent
  Adda dark theme (Playfair Display headings, Plus Jakarta Sans body, score bars,
  mini bar charts, broker table, risk grid). Best after markets close when all
  data is fresh. Use WebSearch injection for richest 5-dimension web coverage.
dependencies:
  - "scores.stage_snapshots must be populated (run sector_rotation_tracker.py --snapshot)"
  - "Screener.in reachable (or use injected_web for offline)"
  - "reports/fundamental/templates/agent_adda_deep_research_template.html must exist"
web_search_injection: |
  # Claude Code pattern — run WebSearch natively then inject:
  from scripts.generate_research_report import generate
  generate("LTFOODS", injected_web={
      "analyst_view":  [{"title":"...","url":"...","snippet":"...","domain":"..."}],
      "order_book":    [...],
      "credit_rating": [...],
      "exports":       [...],
      "latest_news":   [...],
  }, open_browser=True)
template_placeholders: 51
font_patch: "agentadda.in CDN replaced with Google Fonts (Plus Jakarta Sans + Playfair Display)"
ordering_rules:
  - "scores.stage_snapshots must exist (run daily_refresh.py or sector_rotation_tracker.py --snapshot)"
  - "WebSearch injection preferred over DuckDuckGo for richest web data"
  - "chart_image auto-resolves to {symbol_lower}_{date}_chart_embed.png if present"
variants:
  - cli: "python scripts/generate_research_report.py LTFOODS --open"
    description: "Generate and auto-open in browser"
  - cli: "python scripts/generate_research_report.py RELIANCE"
    description: "Generate without opening"
  - cli: "python scripts/generate_research_report.py HDFCBANK --no-web"
    description: "Skip DuckDuckGo (DB + Screener only)"
examples:
  - input: "generate research report for LTFOODS"
    command: "python scripts/generate_research_report.py LTFOODS --open"
  - input: "build the agent adda template report"
    command: "python scripts/generate_research_report.py SYMBOL --open"
related_skills:
  - company_story_v1
  - comprehensive_stock_research_v1
  - equity_chart_v1
output:
  path: "reports/fundamental/{symbol_lower}_{yyyy-mm-dd}.html"
  size_typical: "35-50 KB"
source_file_tokens: 9200

