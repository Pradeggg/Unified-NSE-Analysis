# Agent Adda Curated Workflow Definitions
# These are the high-value, multi-step workflows that a coding assistant
# should understand before writing code or answering questions.
#
# Fields:
#   id, title, description, category, tags, input_patterns,
#   cli, when_to_use, dependencies, phases, ordering_rules,
#   variants, examples, ollama_guidance, source_file_tokens

- id: workflow_daily_pipeline
  title: "Daily Pipeline — 7-Phase Market Refresh"
  description: >
    Full end-to-end daily pipeline: bhavcopy ingest → PostgreSQL EOD →
    universe scoring → fundamentals → VCP materialisation → stage snapshots →
    40 screeners → sector rotation → top picks report → portfolio → fund dashboard
    → email draft → voice briefing. Runs after NSE close (~16:00 IST). ~25–35 min.
  category: workflow
  tags: [pipeline, daily, etl, nse, bhavcopy, scores, reports, email]
  input_patterns:
    - "run daily pipeline"
    - "run EOD reports"
    - "refresh all reports"
    - "run daily refresh"
    - "post market pipeline"
    - "nse daily update"
    - "full pipeline"
    - "daily refresh"
  cli: "python daily_refresh.py"
  when_to_use: "After NSE market close (~16:00 IST / 10:30 UTC) on trading days"
  dependencies:
    - "./postgres/start_pg.sh start   # PostgreSQL must be running"
    - "source .venv/bin/activate"
    - "export OPENAI_API_KEY=..."
  phases:
    - "Phase 1 — Data Ingestion: bhavcopy R loader → PG equity/index EOD → FII/DII / F&O / events / macro feeds"
    - "Phase 2 — Scoring: universe analysis → daily_scores → fundamentals (2B) → stage backfill → VCP materialiser"
    - "Phase 3 — Strategy Lab: portfolio strategy lab HTML"
    - "Phase 4 — Stage & Sector: stage tracker snapshot → 40 screeners → UNKNOWN repair → sector rotation report"
    - "Phase 5 — Picks & Market: screener.in refresh → corporate events → top picks report"
    - "Phase 6 — Portfolio & Fund: portfolio EOD → swing playbook → fund dashboard"
    - "Phase 7 — Distribution: email draft (top picks) → voice briefing script"
  ordering_rules:
    - "PG-FUND-ORDER: postgres/loader.py --fundamentals-only (Step 2B) MUST complete before sector_rotation_tracker.py --snapshot (Step 4B)"
    - "VCP-PICKS-ORDER: scripts/materialize_stage2_vcp_picks.py MUST run before top_picks_report.py"
    - "CSV-200-ORDER: stage tracker requires >=200 days price history; auto-falls back to market.equity_eod"
  variants:
    - cli: "python daily_refresh.py --dry-run"
      description: "Preview plan, no execution"
    - cli: "python daily_refresh.py --live-only"
      description: "Fast price update only (~1 min)"
    - cli: "python daily_refresh.py --skip-analysis"
      description: "Skip heavy scoring, just tracker"
    - cli: "python daily_refresh.py --fundamentals-backfill"
      description: "Force full Nifty 500 screener backfill"
    - cli: "python daily_refresh.py --skip-news"
      description: "Skip yfinance news in fund dashboard"
    - cli: "python daily_refresh.py --email-send"
      description: "Actually send email (default is draft)"
  examples:
    - input: "run the daily pipeline"
      command: "python daily_refresh.py"
    - input: "quick price update only"
      command: "python daily_refresh.py --live-only"
    - input: "preview what the pipeline will do"
      command: "python daily_refresh.py --dry-run"
  ollama_guidance: |
    Set models.mode = hybrid in ~/.agent-adda/config.toml.
    Scoring and screeners run without LLM. Only narrative generation
    (sector rotation report via Anthropic) requires an API key.
    Voice briefing (TTS) requires OPENAI_API_KEY.
  source_file_tokens: 18700

- id: workflow_chart
  title: "Build Equity Chart (TradingView-style)"
  description: >
    Generate a self-contained interactive HTML equity chart for any NSE symbol.
    Includes candlestick (daily 6M + intraday 15m), SMA 20/50/200, EMA9,
    RSI 14, Supertrend(10,3), swing-pivot S/R levels, and relative strength
    tab vs Nifty 50 + sector index. Output: reports/latest/charts/{SYMBOL}_chart.html
  category: workflow
  tags: [chart, technical, candlestick, sma, rsi, supertrend, intraday, html]
  input_patterns:
    - "chart SYMBOL"
    - "show chart of SYMBOL"
    - "technical chart SYMBOL"
    - "draw chart SYMBOL"
    - "SYMBOL chart"
    - "candlestick chart SYMBOL"
    - "show SYMBOL on chart"
    - "open chart SYMBOL"
    - "tradingview chart SYMBOL"
  cli: "python -m terminal.chart_engine SYMBOL --months 6 --intra-days 5 --open"
  when_to_use: "Whenever a user asks to see a chart, technical analysis, or candles for a stock"
  dependencies:
    - "source .venv/bin/activate"
    - "yfinance internet access for live prices"
  variants:
    - cli: "python -m terminal.chart_engine SYMBOL"
      description: "Open chart in browser (default 6M daily + 5d intraday)"
    - cli: "python nse_agent.py → /chart SYMBOL"
      description: "Via REPL slash command"
    - cli: "python nse_agent.py → /chart SYMBOL --html"
      description: "Generate HTML only, don't open browser"
  examples:
    - input: "show me RELIANCE chart"
      command: "python -m terminal.chart_engine RELIANCE --months 6 --intra-days 5 --open"
    - input: "/chart HDFCBANK"
      command: "python nse_agent.py  # then type /chart HDFCBANK"
  source_file_tokens: 5200

