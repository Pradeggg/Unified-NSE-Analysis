id: workflow_company_story
title: Company Story — 15-Dimension Deep Research
description: >
  Full-spectrum company research: business narrative, latest results, P&L, balance
  sheet, cashflow, financial score (5 sub-scores), technical setup (Weinstein stage),
  shareholding/funding, management bio, concall highlights, institutional investors,
  analyst market view, order book, exports/imports, credit rating.
  Pulls from PostgreSQL, Screener.in, and live web search. LLM synthesises a
  readable narrative; falls back to deterministic extract when no LLM key.
category: workflow
tags: [company, story, xray, fundamental, technical, concall, balance_sheet, cashflow, order_book, exports, credit_rating, analyst, management, shareholding, 15dim]
input_patterns:
  - "company story"
  - "build a story"
  - "deep research"
  - "latest results published"
  - "who heads the company"
  - "concall details"
  - "order book"
  - "exports imports"
  - "credit rating"
  - "balance sheet pnl cashflow"
  - "15 dimensions"
  - "full analysis"
cli: "python scripts/company_story.py SYMBOL"
when_to_use: >
  When you need a comprehensive single-document research briefing on a stock:
  all financial, technical, and qualitative dimensions in one HTML report.
  Use after markets close or during weekends for deep research.
variants:
  - cli: "python scripts/company_story.py RELIANCE --open"
    description: "Run and auto-open HTML in browser"
  - cli: "python scripts/company_story.py HDFCBANK --no-web"
    description: "Skip live web search (faster, DB-only)"
  - cli: "python scripts/company_story.py TCS --format json"
    description: "JSON output for programmatic use"
  - cli: "python nse_agent.py → /story SYMBOL"
    description: "REPL command (same orchestrator)"
dimensions:
  db_postgresql:
    - "scores.daily_scores → Weinstein stage, RSI, MACD, SMA50/200, ATR, trend score"
    - "scores.fundamental_scores → EQ, SG, FS, IB, enhanced fund score (0-100)"
    - "scores.quarterly_results → 8 quarters revenue, PAT, margins, YoY/QoQ"
    - "scores.balance_sheet → assets, liabilities, equity, book value"
    - "scores.cash_flow → ops, investing, financing cashflows"
  screener_in:
    - "Company about / business description (what they do, who they serve)"
    - "Shareholding pattern (promoter %, FII, DII, retail)"
    - "Concall transcripts (last 4 quarters)"
    - "Key ratios (PE, ROE, D/E, Sales growth)"
  web_search_live:
    - "Analyst views + target prices (moneycontrol, ET, brokerage)"
    - "Order book / backlog / guidance updates"
    - "Credit ratings (CRISIL, ICRA, CARE, India Ratings)"
    - "Exports & imports breakdown"
    - "Latest results announcement (BSE/NSE filing)"
  company_intelligence_db:
    - "Evidence records, search audit, indexed IR documents"
ordering_rules:
  - "PostgreSQL must be running before running this command"
  - "Optional: run postgres/loader.py --fundamentals-only first for freshest scores"
examples:
  - "python scripts/company_story.py RELIANCE --open"
  - "python scripts/company_story.py TCS --no-web --format json"
  - "python nse_agent.py  # then type: /story HDFCBANK"
source_file_tokens: 8500

