    Lexical evidence search over company_intel.evidence_chunks (titles + snippets from
    curated feeds + primary docs). Returns an evidence pack of top passages with
    citations (source URL), authority tier, and dates.
  category: workflow
  tags: [search, evidence, fts, postgres, company_intel, research]
  input_patterns:
    - "search evidence"
    - "evidence pack"
    - "find passages about order book"
    - "find guidance evidence"
    - "what is the evidence for"
  cli: ".venv/bin/python tools/search_evidence.py \"order book\" --symbol BHEL --limit 12 --days 30"
  when_to_use: "Before writing a research view; to retrieve auditable passages quickly"
  dependencies:
    - "./postgres/start_pg.sh start   # PostgreSQL must be running"
    - "source .venv/bin/activate"
  examples:
    - input: "search evidence for margin pressure in TATASTEEL"
      command: ".venv/bin/python tools/search_evidence.py \"margin pressure\" --symbol TATASTEEL --days 90"
