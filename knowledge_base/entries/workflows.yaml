    episode (steps/validators/artifacts). Use for multi-step operational workflows.
  category: workflow
  tags: [agent, loop, intelligence, kb, episodes, routing]
  input_patterns:
    - "agent adda intelligence loop"
    - "run intelligence loop"
    - "start intelligence loop"
    - "agent loop"
    - "run the loop"
  cli: "python -m terminal.agent_adda_intelligence_loop"
  when_to_use: "When you want the agent to iteratively propose/execute/validate based on KB + episodes."
  source_file_tokens: 2500

- id: workflow_research_sources_sync
  title: "Research Sources — Sync curated feeds (YAML → PostgreSQL)"
  description: >
    Sync curated RSS/Atom sources from config/research_sources.yml into PostgreSQL
    (company_intel.research_sources). Idempotent upsert keyed by (source_kind, source_url).
    This is the first step before ingesting news evidence.
  category: workflow
  tags: [research, news, rss, evidence, company_intel, postgres, sync]
  input_patterns:
    - "sync research sources"
    - "sync curated feeds"
    - "update research_sources"
    - "load research_sources.yml"
  cli: ".venv/bin/python tools/ingest_news_feeds.py --sync-only"
  when_to_use: "When config/research_sources.yml changes or when setting up the evidence engine"
  dependencies:
    - "./postgres/start_pg.sh start   # PostgreSQL must be running"
    - "source .venv/bin/activate"
    - ".venv/bin/python postgres/migrate.py --section company_intel"
  examples:
    - input: "sync curated RSS feeds into Postgres"
      command: ".venv/bin/python tools/ingest_news_feeds.py --sync-only"
  source_file_tokens: 1200

- id: workflow_news_feeds_ingest
  title: "News Evidence — Ingest curated RSS/Atom feeds"
  description: >
    Fetch active curated RSS/Atom feeds (company_intel.research_sources) and ingest
    feed entries into company_intel.source_documents + company_intel.evidence_chunks.
    Stores titles + short summaries as evidence (not full articles).
  category: workflow
  tags: [news, rss, ingest, evidence, company_intel, postgres]
  input_patterns:
    - "ingest news feeds"
    - "rss ingest"
    - "fetch rss"
    - "pull curated news"
    - "news evidence pipeline"
  cli: ".venv/bin/python tools/ingest_news_feeds.py --since-days 7 --max-items-per-feed 25"
  when_to_use: "Daily/periodic refresh of curated news evidence (safe: feeds only)"
  dependencies:
    - "./postgres/start_pg.sh start   # PostgreSQL must be running"
    - "source .venv/bin/activate"
  variants:
    - cli: ".venv/bin/python tools/ingest_news_feeds.py --dry-run"
      description: "Simulate ingestion without DB writes"
    - cli: ".venv/bin/python tools/ingest_news_feeds.py --since-days 1"
      description: "Only last 1 day entries"
  examples:
    - input: "ingest last week of news evidence"
      command: ".venv/bin/python tools/ingest_news_feeds.py --since-days 7"
  source_file_tokens: 1400

- id: workflow_evidence_search
  title: "Evidence Search — PostgreSQL FTS (no embeddings)"
