- id: workflow_build_evidence_pack
  title: "Evidence Pack — Multi-pass retrieval (broad + freshness + authority)"
  description: >
    Build a structured evidence pack for a symbol using repeated FTS searches across
    dimensions (orders, guidance, ratings, policy, etc.) with freshness and authority
    sweeps. Uses config/evidence_dimensions.yml and optional sector overlays.
  category: workflow
  tags: [evidence, research, fts, multi_pass, postgres, company_intel]
  input_patterns:
    - "build evidence pack"
    - "multi pass evidence search"
    - "evidence pack for SYMBOL"
    - "collect evidence across dimensions"
  cli: ".venv/bin/python tools/build_evidence_pack.py --symbol SYMBOL --sector-overlay banks_nbfc"
  when_to_use: "Before generating an on-demand deep research report; to gather auditable passages by dimension"
  variants:
    - cli: ".venv/bin/python tools/build_evidence_pack.py --symbol SYMBOL --sector-overlay infra_shipping"
      description: "Infra/shipping overlay"
    - cli: ".venv/bin/python tools/build_evidence_pack.py --symbol SYMBOL --dimensions orders_orderbook,guidance_outlook --days-passes 0,30"
      description: "Focused dimensions + shorter freshness sweep"
  dependencies:
    - "./postgres/start_pg.sh start   # PostgreSQL must be running"
    - "source .venv/bin/activate"
  examples:
    - input: "build an evidence pack for HDFCBANK (banks/NBFC)"
      command: ".venv/bin/python tools/build_evidence_pack.py --symbol HDFCBANK --sector-overlay banks_nbfc"
  source_file_tokens: 1400

