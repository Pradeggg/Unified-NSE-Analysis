- id: workflow_ollama_local_setup
  title: "Run Agent Adda with Local Ollama (offline)"
  description: >
    Configure Agent Adda to use a local Ollama model instead of OpenAI.
    Recommended model: Granite4 (best balance of quality and speed).
    Also supports nomic-embed-text for local KB embeddings.
    Set models.mode = local-llm in ~/.agent-adda/config.toml.
  category: workflow
  tags: [ollama, local, offline, llm, granite4, embedding, config]
  input_patterns:
    - "use ollama"
    - "run offline"
    - "local llm"
    - "granite4"
    - "no openai key"
    - "ollama setup"
    - "local model"
    - "run without api key"
  cli: "ollama pull granite4 && ollama serve"
  when_to_use: "When no OpenAI API key is available, or to run fully offline"
  variants:
    - cli: "ollama pull granite4"
      description: "Download Granite4 model"
    - cli: "ollama pull nomic-embed-text"
      description: "Download embedding model for local KB vector search"
    - cli: "ollama serve"
      description: "Start Ollama server (default port 11434)"
  examples:
    - input: "run agent adda with local ollama"
      command: |
        ollama pull granite4
        ollama serve &
        # In ~/.agent-adda/config.toml set: [models] mode = "local-llm"
        python nse_agent.py
    - input: "use local embeddings for KB"
      command: |
        ollama pull nomic-embed-text
        KB_EMBED_BACKEND=ollama python -m knowledge_base ask "sector rotation"
  config_guidance: |
    ~/.agent-adda/config.toml:
      [models]
      mode = "local-llm"          # rules | local-llm | openai | hybrid

    Environment:
      KB_EMBED_BACKEND=ollama     # for KB vector search
      KB_OLLAMA_MODEL=nomic-embed-text
      KB_OLLAMA_BASE=http://localhost:11434
  source_file_tokens: 3200

