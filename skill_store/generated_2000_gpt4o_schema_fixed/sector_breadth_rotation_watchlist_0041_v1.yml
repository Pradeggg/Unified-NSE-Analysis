    name: "Sector_Breadth_Ranking"
    template: "\n                SELECT\n                    sd.sector,\n                    AVG(sd.pct_above_50dma) AS avg_pct_above_50dma,\n                    AVG(ma.stage2_pct) AS avg_stage2_pct\n                FROM\n                    breadth.sector_daily sd\n                JOIN\n                    breadth.ma_pct_above ma\n                ON\n                    sd.snapshot_date = ma.snapshot_date\n                WHERE\n                    sd.snapshot_date >= CURRENT_DATE - INTERVAL '3 months'\n                GROUP BY\n                    sd.sector\n                ORDER BY\n                    avg_stage2_pct DESC,\n                    avg_pct_above_50dma DESC\n                LIMIT 10;\n            "
