    name: "improving_sector_stocks"
    query: "SELECT ss.symbol, ss.company_name, ss.sector FROM scores.stage_snapshots ss JOIN (SELECT sector FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months') sd ON ss.sector = sd.sector WHERE ss.stage = 'STAGE_2' AND ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.trading_signal IN ('BUY', 'STRONG_BUY') LIMIT 10;"
