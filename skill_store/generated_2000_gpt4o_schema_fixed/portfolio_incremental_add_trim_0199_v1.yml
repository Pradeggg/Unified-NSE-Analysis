    -
      title: "Get Latest Holdings with Stage Data"
      description: "Retrieve current holdings with latest stage scores for add/trim analysis."
      template: "WITH latest_stage_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT portfolio.holdings.symbol, portfolio.holdings.qty, portfolio.holdings.avg_cost, scores.stage_snapshots.price, scores.stage_snapshots.stage, scores.stage_snapshots.trading_signal FROM portfolio.holdings INNER JOIN latest_stage_snapshots ON portfolio.holdings.symbol = latest_stage_snapshots.symbol;"
    -
      title: "Candidates for Addition"
      description: "Identify stocks with a strong buy or buy signal for potential additions."
      template: "SELECT symbol, company_name, sector, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND trading_signal IN ('BUY', 'STRONG_BUY') LIMIT 10;"
    -
      title: "Candidates for Trimming"
      description: "Identify stocks with a sell signal for potential trimming."
      template: "SELECT symbol, company_name, sector, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND trading_signal = 'SELL' LIMIT 10;"
