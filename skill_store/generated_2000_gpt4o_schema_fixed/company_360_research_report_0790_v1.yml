      step: "Fetch quarterly results."
      sql:
        template: "SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = '{{symbol}}' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC;"
    -
      step: "Fetch annual results."
      sql:
        template: "SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE symbol = '{{symbol}}' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC;"
    -
      step: "Extract balance sheet data."
      sql:
        template: "SELECT * FROM scores.balance_sheet WHERE symbol = '{{symbol}}' ORDER BY period_end DESC LIMIT 1;"
    -
      step: "Extract cash flow details."
      sql:
        template: "SELECT * FROM scores.cash_flow WHERE symbol = '{{symbol}}' ORDER BY period_end DESC LIMIT 1;"
    -
      step: "Analyze market EOD data."
