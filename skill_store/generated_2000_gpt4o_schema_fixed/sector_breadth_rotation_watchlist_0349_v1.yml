    -
      outputs: "sector_ranks"
      query: "WITH recent_breadth AS (SELECT sector, AVG(pct_above_50dma) AS avg_pct_above_50dma, AVG(change_5d) AS avg_change_5d FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector), stage_contrib AS (SELECT sector, COUNT(symbol) AS stage2_participation FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector) SELECT rb.sector, rb.avg_pct_above_50dma, sc.stage2_participation FROM recent_breadth rb JOIN stage_contrib sc ON rb.sector = sc.sector ORDER BY sc.stage2_participation DESC, rb.avg_pct_above_50dma DESC LIMIT 10;"
    -
      outputs: "candidate_symbols"
      query: "SELECT ss.symbol, ss.company_name FROM scores.stage_snapshots ss JOIN market.equity_eod eod ON ss.symbol = eod.symbol AND ss.snapshot_date = eod.trade_date WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY ss.stage_score DESC LIMIT 10;"
