      template: "WITH latest_snapshots AS (SELECT MAX(snapshot_date) AS latest_date FROM breadth.sector_daily), \nranked_sectors AS (\n    SELECT sd.sector,\n           AVG(sd.pct_above_50dma::numeric) as avg_50dma,\n           AVG(mpa.stage2_pct) as avg_stage2,\n           RANK() OVER (ORDER BY AVG(sd.pct_above_50dma::numeric) DESC) AS dma_rank,\n           RANK() OVER (ORDER BY AVG(mpa.stage2_pct) DESC) AS stage2_rank\n    FROM breadth.sector_daily sd\n    JOIN breadth.ma_pct_above mpa ON sd.snapshot_date = mpa.snapshot_date\n    WHERE sd.snapshot_date BETWEEN latest_snapshots.latest_date - INTERVAL '4 days' AND latest_snapshots.latest_date\n    GROUP BY sd.sector\n)\nSELECT * FROM ranked_sectors\nORDER BY dma_rank, stage2_rank\nLIMIT 10;"
