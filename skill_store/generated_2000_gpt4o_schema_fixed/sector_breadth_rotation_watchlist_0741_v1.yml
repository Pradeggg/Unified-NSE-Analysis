    id: "sector_breadth_analysis_last_3_months"
    template: "WITH recent_sector_data AS (\n    SELECT sector, AVG(pct_above_50dma::NUMERIC) AS avg_pct_above_50dma, AVG(change_5d::NUMERIC) AS avg_change_5d\n    FROM breadth.sector_daily\n    WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months'\n    GROUP BY sector\n),\nlatest_stage AS (\n    SELECT sector, COUNT(*) FILTER (WHERE stage = 'STAGE_2') AS stage_2_count\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n    GROUP BY sector\n)\nSELECT r.sector, r.avg_pct_above_50dma, r.avg_change_5d, l.stage_2_count\nFROM recent_sector_data r\nJOIN latest_stage l ON r.sector = l.sector\nORDER BY l.stage_2_count DESC, r.avg_change_5d DESC\nLIMIT 10;"
  -
    id: "candidate_stocks_stage2"
    template: "SELECT symbol, company_name, change_1m_pct, stage\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n  AND stage = 'STAGE_2'\n  AND trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY change_1m_pct DESC\nLIMIT 10;"
