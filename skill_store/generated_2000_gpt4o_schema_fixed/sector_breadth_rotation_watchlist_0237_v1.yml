    query: "WITH latest_snapshot AS (SELECT MAX(snapshot_date) AS snapshot_date FROM scores.stage_snapshots), latest_sector_breadth AS (SELECT sd.sector, sd.pct_above_50dma, ma.stage2_pct FROM breadth.sector_daily sd JOIN breadth.ma_pct_above ma ON sd.snapshot_date = ma.snapshot_date WHERE sd.snapshot_date = (SELECT snapshot_date FROM latest_snapshot)), stage2_stocks AS (SELECT s.sector, s.symbol, s.trading_signal FROM scores.stage_snapshots s WHERE s.stage = 'STAGE_2' AND s.trading_signal IN ('BUY', 'STRONG_BUY') AND s.snapshot_date = (SELECT snapshot_date FROM latest_snapshot)) SELECT lsb.sector, lsb.pct_above_50dma, lsb.stage2_pct, count(ss.symbol) AS stage2_count FROM latest_sector_breadth lsb LEFT JOIN stage2_stocks ss ON lsb.sector = ss.sector GROUP BY lsb.sector, lsb.pct_above_50dma, lsb.stage2_pct ORDER BY lsb.stage2_pct DESC, stage2_count DESC LIMIT 10;"
