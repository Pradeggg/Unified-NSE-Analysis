  improving_sectors: "SELECT sector FROM breadth.sector_daily JOIN breadth.ma_pct_above ON breadth.sector_daily.snapshot_date = breadth.ma_pct_above.snapshot_date WHERE breadth.sector_daily.snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) AND breadth_signal = 'POSITIVE' GROUP BY sector;"
