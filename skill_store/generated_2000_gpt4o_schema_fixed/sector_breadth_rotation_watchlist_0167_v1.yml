  -
    description: "Retrieve sectors ranked by breadth and Stage 2 participation."
    sql: "WITH latest_breadth AS (SELECT sector, snapshot_date, pct_above_50dma, change_5d FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)), latest_ma_pct AS (SELECT snapshot_date, stage2_pct FROM breadth.ma_pct_above WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.ma_pct_above)) SELECT lb.sector, lb.pct_above_50dma, lb.change_5d, lmp.stage2_pct FROM latest_breadth lb JOIN latest_ma_pct lmp ON lb.snapshot_date = lmp.snapshot_date ORDER BY lmp.stage2_pct DESC;"
  -
    description: "Identify improving sectors."
    sql: "SELECT sector, change_5d, breadth_signal FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) AND breadth_signal = 'IMPROVING';"
  -
    description: "Select top candidates from improving sectors."
    sql: "SELECT ss.symbol, ss.company_name, se.close, ss.stage, ss.trading_signal FROM scores.stage_snapshots ss JOIN market.equity_eod se ON ss.symbol = se.symbol AND ss.snapshot_date = se.trade_date WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.sector IN (SELECT sector FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) AND breadth_signal = 'IMPROVING') AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY ss.relative_strength DESC LIMIT 10;"
