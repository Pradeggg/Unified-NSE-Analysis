    purpose: "Retrieve latest EOD stocks with breakout, VCP, and strong fundamentals."
    template: "\n            WITH latest_eod AS (\n                SELECT symbol, high, close, volume, market_cap_cr\n                FROM market.equity_eod\n                WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)\n            ),\n            latest_stage AS (\n                SELECT symbol, stage, trading_signal, enhanced_fund_score\n                FROM scores.stage_snapshots\n                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n                AND stage = 'STAGE_2'\n                AND trading_signal IN ('BUY', 'STRONG_BUY')\n            ),\n            vcp_candidates AS (\n                SELECT symbol, vcp_score\n                FROM scores.stage2_vcp_picks\n                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)\n                ORDER BY vcp_score DESC\n                LIMIT 20\n            )\n            SELECT e.symbol, e.high, e.close, e.volume, e.market_cap_cr, s.stage, s.trading_signal, s.enhanced_fund_score, v.vcp_score\n            FROM latest_eod e\n            JOIN latest_stage s ON e.symbol = s.symbol\n            JOIN vcp_candidates v ON e.symbol = v.symbol\n            ORDER BY v.vcp_score DESC, s.enhanced_fund_score DESC\n            LIMIT 50;\n            "
