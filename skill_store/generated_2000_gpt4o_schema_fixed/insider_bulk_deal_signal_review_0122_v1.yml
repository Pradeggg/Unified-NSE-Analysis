      query: "WITH latest_dates AS (SELECT MAX(alert_date) as max_date FROM signals.insider_alerts) SELECT ia.symbol, ia.alert_date, ia.qty, ia.value_cr, ia.alert_type, ss.stage, ss.technical_score FROM signals.insider_alerts ia JOIN scores.stage_snapshots ss ON ia.symbol = ss.symbol WHERE ia.alert_date >= (SELECT max_date - INTERVAL '5 days' FROM latest_dates) ORDER BY ia.alert_date DESC LIMIT 10;"
    -
      description: "Get recent bulk or block deals with technical confirmations."
      query: "WITH latest_dates AS (SELECT MAX(deal_date) as max_date FROM signals.bulk_block_deals) SELECT bbd.symbol, bbd.deal_date, bbd.qty, bbd.price, bbd.deal_type, ss.stage, ss.technical_score FROM signals.bulk_block_deals bbd JOIN scores.stage_snapshots ss ON bbd.symbol = ss.symbol WHERE bbd.deal_date >= (SELECT max_date - INTERVAL '5 days' FROM latest_dates) AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY bbd.deal_date DESC LIMIT 10;"
