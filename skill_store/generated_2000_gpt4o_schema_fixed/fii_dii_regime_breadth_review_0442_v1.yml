    template: "WITH latest_flows AS (\n    SELECT trade_date, fii_net_today, dii_net_today, flow_signal\n    FROM signals.fii_dii_flows\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months'\n), latest_regime AS (\n    SELECT trade_date, regime, confidence\n    FROM signals.regime_history\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months'\n), latest_breadth AS (\n    SELECT trade_date, adv_signal, market_sentiment\n    FROM breadth.market_daily\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months'\n), latest_index AS (\n    SELECT trade_date, close, change_pct\n    FROM market.index_eod\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months'\n    AND index_symbol = 'Nifty 50'\n)\nSELECT \n    f.trade_date, \n    f.fii_net_today, \n    f.dii_net_today, \n    f.flow_signal, \n    r.regime, \n    r.confidence, \n    b.adv_signal, \n    b.market_sentiment, \n    i.close AS index_close,\n    i.change_pct AS index_change_pct\nFROM latest_flows f\nJOIN latest_regime r ON f.trade_date = r.trade_date\nJOIN latest_breadth b ON f.trade_date = b.trade_date\nJOIN latest_index i ON f.trade_date = i.trade_date\nORDER BY f.trade_date DESC;\n"
