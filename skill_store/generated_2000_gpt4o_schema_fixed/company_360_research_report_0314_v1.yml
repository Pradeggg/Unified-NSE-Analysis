tool_plan_template:
  -
    table: "scores.stage_snapshots"
    description: "Retrieve the latest stage snapshot for the company."
    sql_template: "SELECT * FROM scores.stage_snapshots WHERE symbol = $1 AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 1;"
  -
    table: "scores.quarterly_results"
    description: "Fetch the latest quarterly results."
    sql_template: "SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = $1 AND period_type = 'quarter' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC LIMIT 1;"
  -
    table: "scores.annual_results"
    description: "Fetch the latest annual results."
    sql_template: "SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE symbol = $1 AND period_type = 'annual' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC LIMIT 1;"
  -
    table: "scores.balance_sheet"
    description: "Align the latest balance-sheet data with the annual results."
    sql_template: "SELECT * FROM scores.balance_sheet WHERE symbol = $1 AND period_end = (SELECT period_end FROM scores.annual_results WHERE symbol = $1 ORDER BY period_end DESC LIMIT 1) LIMIT 1;"
  -
    table: "scores.cash_flow"
    description: "Align the latest cash-flow data with the annual results."
    sql_template: "SELECT * FROM scores.cash_flow WHERE symbol = $1 AND period_end = (SELECT period_end FROM scores.annual_results WHERE symbol = $1 ORDER BY period_end DESC LIMIT 1) LIMIT 1;"
  -
    table: "scores.results_analysis"
    description: "Fetch the latest results analysis."
    sql_template: "SELECT DISTINCT ON (symbol) * FROM scores.results_analysis WHERE symbol = $1 ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC LIMIT 1;"
  -
    table: "market.equity_eod"
    description: "Get the latest EOD market data."
    sql_template: "SELECT * FROM market.equity_eod WHERE symbol = $1 AND trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) LIMIT 1;"
