tool_plan_template: "\nGenerate a comprehensive research report using the latest data.\n1. Retrieve the latest stage snapshot, financials, and EOD prices for the given company.\n2. Create an action watchlist style response detailing fundamental analysis.\n3. Highlight any valuation gaps, thesis, and risks.\n"
sql_templates:
  company_snapshot: "\nSELECT company_name, sector, price, market_cap_cat, stage, trend_signal, trading_signal\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\nAND symbol = '{{symbol}}';\n"
  financial_trends: "\nSELECT period_label, revenue, operating_profit, pat, eps\nFROM scores.annual_results\nWHERE symbol = '{{symbol}}'\nAND period_type = 'annual'\nORDER BY period_end DESC\nLIMIT 3;\n"
  technical_setup: "\nSELECT close, volume, change_pct, week52_high, week52_low\nFROM market.equity_eod\nWHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)\nAND symbol = '{{symbol}}';\n"
  valuation_gaps: "\nSELECT eps, pbt, revenue, opm_pct\nFROM scores.quarterly_results\nWHERE symbol = '{{symbol}}'\nAND period_type = 'quarter'\nORDER BY period_end DESC\nLIMIT 1;\n"
  thesis: "\nSELECT narrative, stance\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\nAND symbol = '{{symbol}}';\n"
  risks: "\nSELECT key_risks, verdict\nFROM scores.results_analysis\nWHERE symbol = '{{symbol}}'\nAND period_end = (SELECT MAX(period_end) FROM scores.results_analysis WHERE symbol = '{{symbol}}');\n"
