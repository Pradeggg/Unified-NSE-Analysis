    description: "Fetch upcoming corporate events and related results with stage context."
    sql: "WITH latest_stage AS (\n    SELECT DISTINCT ON (symbol) symbol, stage\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n), \nlatest_results AS (\n    SELECT DISTINCT ON (symbol) symbol, period_end, filing_date, score, source_trail\n    FROM scores.results_analysis\n    ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC\n)\nSELECT e.symbol, e.event_type, e.event_date, ls.stage, lr.filing_date, lr.source_trail\nFROM signals.corporate_events e\nJOIN latest_stage ls ON e.symbol = ls.symbol\nJOIN latest_results lr ON e.symbol = lr.symbol\nWHERE e.event_date >= CURRENT_DATE\nORDER BY e.event_date\nLIMIT 100;"
