    template_sql: "\n            WITH latest_eod AS (\n                SELECT * FROM market.equity_eod\n                WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)\n                AND series = 'EQ'\n            ),\n            latest_snapshots AS (\n                SELECT * FROM scores.stage_snapshots\n                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n                AND stage = 'STAGE_2'\n                AND trading_signal IN ('BUY', 'STRONG_BUY')\n            ),\n            latest_vcp AS (\n                SELECT * FROM scores.stage2_vcp_picks\n                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)\n                ORDER BY vcp_score DESC, rank ASC\n                LIMIT 50\n            )\n            SELECT eod.symbol, eod.close, snaps.stage, snaps.trading_signal, vcp.vcp_score\n            FROM latest_eod eod\n            JOIN latest_snapshots snaps ON eod.symbol = snaps.symbol\n            JOIN latest_vcp vcp ON eod.symbol = vcp.symbol\n            WHERE eod.close > eod.week52_high * 0.95\n            ORDER BY vcp.vcp_score DESC;\n        "
