    description: "Calculate returns for major indices over the last 3 months."
    sql: "SELECT index_symbol, (close - prev_close) / prev_close * 100 AS return_pct FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months' AND trade_date = (SELECT MAX(trade_date) FROM market.index_eod) ORDER BY return_pct DESC;"
  -
    name: "Fetch_Stage_Distribution"
    description: "Analyze distribution of stocks in different stages from latest snapshots."
    sql: "SELECT stage, COUNT(*) AS count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY stage ORDER BY count DESC;"
  -
    name: "Leading_Sectors"
    description: "Identify leading sectors based on relative performance."
    sql: "SELECT sector, AVG(relative_strength) AS avg_relative_strength FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_relative_strength DESC LIMIT 5;"
  -
    name: "Primary_Candidates"
    description: "Fetch top swing trading candidates in Stage 2 with strong buy signals."
    sql: "SELECT symbol, company_name, price, trading_signal FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) AND trading_signal IN ('STRONG_BUY', 'BUY') ORDER BY vcp_score DESC LIMIT 10;"
