  -
    name: "stage_distribution"
    description: "Assess stage distribution change for sectors."
    sql: "SELECT sector, stage, COUNT(*) AS count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage IN ('STAGE_2') GROUP BY sector, stage"
  -
    name: "sector_leadership"
    description: "Identify leading sectors based on performance."
    sql: "SELECT sector, AVG(relative_strength) AS avg_strength FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_strength DESC LIMIT 5"
