  -
    name: "latest_quarterly_results"
    query: "SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = :symbol ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC;"
  -
    name: "annual_results_with_balance_sheet"
    query: "SELECT ar.*, bs.total_assets, bs.total_liabilities FROM scores.annual_results ar JOIN scores.balance_sheet bs ON ar.symbol = bs.symbol AND ar.period_end = bs.period_end WHERE ar.symbol = :symbol ORDER BY ar.period_end DESC LIMIT 1;"
