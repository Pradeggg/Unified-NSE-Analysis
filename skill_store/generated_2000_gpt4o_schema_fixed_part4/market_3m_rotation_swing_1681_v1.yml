sql_templates:
  -
    name: "Index Returns 3M"
    description: "Calculate index returns over the last 3 months."
    template: "SELECT index_symbol, (MAX(close) - MIN(close)) / MIN(close) * 100 AS return_3m FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY index_symbol;"
  -
    name: "Stage Distribution"
    description: "Evaluate stage distribution changes over the last 3 months."
    template: "SELECT stage, COUNT(*) AS count FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY stage ORDER BY count DESC;"
  -
    name: "Leading Sectors"
    description: "Identify leading sectors in stage 2."
    template: "SELECT sector, COUNT(*) AS count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector ORDER BY count DESC LIMIT 5;"
  -
    name: "Primary Candidates"
    description: "Identify primary swing trading candidates."
    template: "SELECT symbol, company_name, trading_signal FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) AND trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY vcp_score DESC LIMIT 10;"
