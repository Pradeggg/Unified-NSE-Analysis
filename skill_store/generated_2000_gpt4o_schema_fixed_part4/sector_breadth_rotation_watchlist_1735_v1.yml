    template: "SELECT sector, AVG(pct_above_50dma::numeric) as avg_pct_above_50dma, AVG(change_5d::numeric) as avg_change_5d, COUNT(*) as num_days FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '20 days' GROUP BY sector ORDER BY avg_pct_above_50dma DESC LIMIT 5;"
    description: "Query to get top 5 sectors based on average 50DMA participation and 5-day change over the last 20 sessions."
  stage_two_candidates:
    template: "SELECT s.symbol, s.company_name, s.sector, s.stage_score, s.relative_strength FROM scores.stage_snapshots s JOIN breadth.sector_daily bs ON s.sector = bs.sector WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND s.stage = 'STAGE_2' AND s.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY s.relative_strength DESC LIMIT 10;"
    description: "Query to select symbols in Stage 2 with strong trading signals, ordered by relative strength."
