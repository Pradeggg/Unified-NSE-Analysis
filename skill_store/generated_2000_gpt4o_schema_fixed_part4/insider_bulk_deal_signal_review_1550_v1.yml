sql_templates:
  insider_join_bulk:
    query_type: "SELECT"
    query: "WITH insider_deals AS (SELECT symbol, alert_date, insider_score FROM signals.insider_alerts WHERE alert_date >= CURRENT_DATE - INTERVAL '3 months'), bulk_deals AS (SELECT symbol, deal_date, qty FROM signals.bulk_block_deals WHERE deal_date >= CURRENT_DATE - INTERVAL '3 months') SELECT insider_deals.symbol, MAX(insider_deals.insider_score) AS max_insider_score, SUM(bulk_deals.qty) AS total_qty FROM insider_deals JOIN bulk_deals ON insider_deals.symbol = bulk_deals.symbol GROUP BY insider_deals.symbol ORDER BY max_insider_score DESC, total_qty DESC LIMIT 100"
  bulk_technical_confirmation:
    query_type: "SELECT"
    query: "SELECT scores.symbol, scores.stage, scores.technical_score FROM scores.stage_snapshots AS scores WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY technical_score DESC LIMIT 100"
