    sql: "WITH latest_stage AS (SELECT sector, COUNT(*) AS stage_2_count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector), latest_breadth AS (SELECT sector, AVG(pct_above_50dma) AS avg_breadth FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) GROUP BY sector) SELECT b.sector, b.avg_breadth, s.stage_2_count FROM latest_breadth b JOIN latest_stage s ON b.sector = s.sector ORDER BY b.avg_breadth DESC, s.stage_2_count DESC LIMIT 10;"
  -
