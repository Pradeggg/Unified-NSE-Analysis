    sql: "WITH recent_events AS (SELECT ce.symbol, ce.event_type, ce.event_date, ce.purpose_raw, ce.detail, ce.source FROM signals.corporate_events ce WHERE ce.event_date >= CURRENT_DATE - INTERVAL '1 month'),\nlatest_analysis AS (SELECT DISTINCT ON (ra.symbol) ra.symbol, ra.verdict, ra.filing_date, ra.score FROM scores.results_analysis ra ORDER BY ra.symbol, ra.period_end DESC NULLS LAST, ra.updated_at DESC),\ncurrent_stage AS (SELECT DISTINCT ON (ss.symbol) ss.symbol, ss.stage, ss.trading_signal FROM scores.stage_snapshots ss WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots))\nSELECT re.symbol, re.event_type, re.event_date, re.purpose_raw, re.detail, re.source, la.verdict, la.score, cs.stage, cs.trading_signal FROM recent_events re\nJOIN latest_analysis la ON re.symbol = la.symbol\nJOIN current_stage cs ON re.symbol = cs.symbol LIMIT 50;"
