sql_templates:
  -
    title: "Recent Market Index Trends"
    query: "SELECT index_symbol, AVG(change_pct) AS avg_change FROM market.index_eod WHERE trade_date >= (CURRENT_DATE - INTERVAL '3 months') GROUP BY index_symbol ORDER BY avg_change DESC LIMIT 5;"
  -
    title: "Sector Performance Analysis"
    query: "SELECT sector, AVG(change_1m_pct) AS avg_1m_change FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_1m_change DESC LIMIT 5;"
  -
    title: "Stage 2 Leadership"
    query: "SELECT symbol, company_name, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' AND trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY stage_score DESC LIMIT 5;"
  -
    title: "VCP Candidate Validation"
    query: "SELECT v.symbol, v.company_name, v.trading_signal FROM scores.stage2_vcp_picks v JOIN scores.stage_snapshots s ON v.symbol = s.symbol WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) AND s.stage = 'STAGE_2' ORDER BY v.vcp_score DESC LIMIT 5;"
