    description: "Fetch latest snapshots for current portfolio holdings with stage, scores, and signals."
    sql: "WITH latest_stage_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT h.symbol, h.qty, h.avg_cost, s.stage, s.stage_score, s.trading_signal FROM portfolio.holdings h INNER JOIN latest_stage_snapshots s ON h.symbol = s.symbol;"
  -
    template_name: "Select_Add_Candidates"
    description: "Identify add candidates based on positive signals and Stage 2 condition."
    sql: "WITH latest_stage_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT s.symbol, s.company_name, s.sector, s.trading_signal FROM latest_stage_snapshots s WHERE s.trading_signal IN ('BUY', 'STRONG_BUY') AND s.stage = 'STAGE_2' ORDER BY s.stage_score DESC LIMIT 10;"
  -
    template_name: "Select_Trim_Candidates"
    description: "Identify trim candidates based on negative signals or Stage 4 condition."
    sql: "WITH latest_stage_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT s.symbol, s.company_name, s.sector, s.trading_signal FROM latest_stage_snapshots s WHERE s.trading_signal = 'SELL' OR s.stage = 'STAGE_4' ORDER BY s.stage_score ASC LIMIT 10;"
