sql_templates:
  sector_ranks:
    template: "WITH latest_sector_data AS (\n    SELECT sector, MAX(snapshot_date) AS latest_date\n    FROM breadth.sector_daily\n    GROUP BY sector\n), \nlatest_stage_data AS (\n    SELECT sector, MAX(snapshot_date) AS latest_date\n    FROM scores.stage_snapshots\n    WHERE stage = 'STAGE_2'\n    GROUP BY sector\n)\nSELECT sd.sector, sd.pct_above_50dma, mpa.stage2_pct\nFROM breadth.sector_daily sd\nJOIN latest_sector_data lsd ON sd.sector = lsd.sector AND sd.snapshot_date = lsd.latest_date\nJOIN breadth.ma_pct_above mpa ON sd.snapshot_date = mpa.snapshot_date\nORDER BY mpa.stage2_pct DESC\nLIMIT 10;"
    description: "Ranks sectors by stage 2 participation and breadth above 50dma."
    limitations:
      - "Top 10 sectors only."
  improving_sectors:
    template: "SELECT sector, change_5d, breadth_signal\nFROM breadth.sector_daily\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)\nAND breadth_signal = 'POSITIVE'\nORDER BY change_5d DESC\nLIMIT 5;"
    description: "Identify sectors with positive breadth signals and 5-day improvements."
    limitations:
      - "Limit to sectors with 'POSITIVE' breadth signal."
  candidate_symbols:
    template: "SELECT ss.symbol, ss.company_name, ss.change_1w_pct, ss.relative_strength\nFROM scores.stage_snapshots ss\nJOIN breadth.sector_daily sd ON sd.sector = ss.sector\nWHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\nAND ss.stage = 'STAGE_2'\nAND trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY ss.relative_strength DESC\nLIMIT 10;"
    description: "Select symbols in sectors with improving breadth and buy signals."
    limitations:
      - "Includes only Stage 2 stocks with BUY signals."
