    sql: "WITH latest_results AS (SELECT DISTINCT ON (symbol) symbol, company_name, verdict, growth_yoy_revenue_pct, growth_qoq_revenue_pct FROM scores.results_analysis ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC) SELECT r.symbol, r.company_name, r.verdict, r.growth_yoy_revenue_pct, r.growth_qoq_revenue_pct, ss.trading_signal FROM latest_results r JOIN scores.stage_snapshots ss ON r.symbol = ss.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 50;"
