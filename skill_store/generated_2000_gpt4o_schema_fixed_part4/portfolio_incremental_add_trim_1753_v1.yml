  risk_flags: "SELECT ss.symbol, ss.company_name, ss.rsi, ss.trend_signal FROM scores.stage_snapshots ss JOIN portfolio.holdings ph ON ss.symbol = ph.symbol WHERE ss.rsi > 70 OR ss.trend_signal = 'BEARISH' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 5;"
