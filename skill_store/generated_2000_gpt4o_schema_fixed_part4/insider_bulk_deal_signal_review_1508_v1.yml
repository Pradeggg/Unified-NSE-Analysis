    template: "WITH latest_bulk_deals AS ( SELECT bbd.symbol, bbd.deal_type, bbd.qty, bbd.price, bbd.deal_date FROM signals.bulk_block_deals bbd WHERE bbd.deal_date = (SELECT MAX(deal_date) FROM signals.bulk_block_deals) ), latest_stage_snapshots AS ( SELECT ss.symbol, ss.stage, ss.trading_signal, ss.technical_score FROM scores.stage_snapshots ss WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ) SELECT lbd.symbol, lbd.deal_type, lbd.qty, lbd.price, lss.stage, lss.trading_signal, lss.technical_score FROM latest_bulk_deals lbd JOIN latest_stage_snapshots lss ON lbd.symbol = lss.symbol;"
