    template: "WITH latest_insider_alerts AS ( SELECT ia.symbol, ia.alert_type, ia.qty, ia.alert_date, ia.value_cr, ia.insider_score FROM signals.insider_alerts ia WHERE ia.alert_date = (SELECT MAX(alert_date) FROM signals.insider_alerts) ), latest_stage_snapshots AS ( SELECT ss.symbol, ss.stage, ss.trading_signal, ss.technical_score FROM scores.stage_snapshots ss WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ) SELECT lia.symbol, lia.alert_type, lia.qty, lia.value_cr, lss.stage, lss.trading_signal, lss.technical_score FROM latest_insider_alerts lia JOIN latest_stage_snapshots lss ON lia.symbol = lss.symbol;"
