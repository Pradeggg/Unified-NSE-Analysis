python_tools:
  -
    description: "Check for data freshness and missing information in reports."
    name: "validate_data_freshness"
    run: "def run(context):\n    findings = []\n    broken_links = []\n    missing_data = []\n\n    # Fetch recent report runs within the last week\n    report_runs = context.sql(\"SELECT run_id, run_ts, analysis_date FROM report.enhanced_runs WHERE run_ts >= CURRENT_DATE - INTERVAL '7 days';\")\n\n    for run in report_runs:\n        run_id = run['run_id']\n        missing_data_count = context.sql(\"SELECT COUNT(symbol) as cnt FROM report.enhanced_filtered_stocks WHERE run_id = '{}' AND current_price IS NULL;\".format(run_id))[0]['cnt']\n        \n        if missing_data_count > 0:\n            missing_data.append({'run_id': run_id, 'missing_data_count': missing_data_count})\n            findings.append(\"Run {} has {} stocks with missing data.\".format(run_id, missing_data_count))\n\n    # Generate the remediation and verification steps\n    remediation = \"Ensure that current price data is available for all stocks in report runs for accurate assessment.\"\n    verification = \"Re-run the query to confirm current prices are populated after corrections.\"\n\n    return {\n        'findings': findings,\n        'broken_links': broken_links,\n        'missing_data': missing_data,\n        'remediation': remediation,\n        'verification': verification\n    }"
