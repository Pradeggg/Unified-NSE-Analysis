    status: "needs_heal"
  sql_templates:
    -
      description: "Get the latest 20 trading sessions from enhanced report runs."
      name: "FetchLatestRuns"
      template: "SELECT run_id, run_ts FROM report.enhanced_runs ORDER BY run_ts DESC LIMIT 20;"
    -
      description: "Identify broken report links in the latest runs."
      name: "FetchBrokenLinks"
      template: "SELECT run_id, notes FROM report.enhanced_runs WHERE notes LIKE '%broken link%' ORDER BY run_ts DESC LIMIT 20;"
    -
      description: "Retrieve filtered stocks data for review."
      name: "FetchFilteredStocks"
      template: "SELECT run_id, symbol, current_price, recommendation FROM report.enhanced_filtered_stocks WHERE run_id IN ({run_ids}) AND recommendation != 'HOLD';"
