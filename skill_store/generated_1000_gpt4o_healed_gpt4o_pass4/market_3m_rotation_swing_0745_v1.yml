  created_by: "llm_generated"
  description: "Analyze broad market regime, sector leadership, stages, and liquid swing candidates. Variant focus: risk-first review; timeframe: last 3 months; response style: QA checklist."
  domain: "market_analysis"
  evidence_required:
    tables:
      - "market.index_eod"
      - "market.equity_eod"
      - "scores.stage_snapshots"
      - "scores.stage2_vcp_picks"
  generation_model: "gpt-4o"
