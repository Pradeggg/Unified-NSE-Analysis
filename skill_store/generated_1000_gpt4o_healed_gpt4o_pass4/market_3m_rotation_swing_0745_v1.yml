  input_patterns:
    - "last 3 months market analysis"
    - "find swing candidates from recent sector rotation"
    - "market regime and stage 2 leadership over 3 months"
    - "risk-first review for last 3 months: last 3 months market analysis"
    - "market regime and stage 2 leadership over 3 months as QA checklist"
  output_contract:
    - "as_of_date"
    - "stage_distribution_change"
    - "leading_sectors"
    - "primary_candidates"
    - "risks"
  python_tools:
    -
      approved_tables:
        - "market.index_eod"
        - "scores.stage_snapshots"
      code: "def run(context):\n    risks = []\n    for return_data in context['index_returns']:\n        if return_data['return_pct'] < -5:\n            risks.append({'index': return_data['index_symbol'], 'risk': 'High volatility'})\n    return risks"
      id: "risk_evaluation_tool"
      inputs:
        - "index_returns"
        - "stage_distribution_change"
        - "leading_sectors"
      language: "python"
      mode: "read_only"
      outputs:
        - "risks"
  sql_templates:
    -
      description: "Calculate index returns over the last 3 months."
      template: "WITH period_returns AS (SELECT trade_date, index_symbol, close, LAG(close) OVER (PARTITION BY index_symbol ORDER BY trade_date) AS prev_close FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '90' DAY) SELECT index_symbol, ROUND((close - prev_close) / prev_close * 100, 2) AS return_pct FROM period_returns WHERE trade_date = (SELECT MAX(trade_date) FROM period_returns);"
    -
      description: "Identify leading sectors based on stage scores over the last 3 months."
      template: "SELECT sector, AVG(stage_score) AS avg_stage_score FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '90' DAY GROUP BY sector ORDER BY avg_stage_score DESC;"
