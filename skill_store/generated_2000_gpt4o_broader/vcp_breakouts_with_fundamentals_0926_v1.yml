sql_templates:
  -
    name: "find_potential_breakouts"
    description: "Query to find stocks hitting new highs or identified as VCP breakouts."
    template: "WITH recent_performance AS (SELECT symbol, max(trade_date) as latest_date FROM market.equity_eod WHERE DATE(trade_date) >= DATE_SUB(CURRENT_DATE, INTERVAL 5 DAY) GROUP BY symbol), potential_stocks AS (SELECT symbol, high, week52_high FROM market.equity_eod WHERE trade_date = (SELECT max(latest_date) FROM recent_performance) AND high = week52_high UNION SELECT symbol, price, null as week52_high FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT max(latest_date) FROM recent_performance) AND vcp_score > 0) SELECT * FROM potential_stocks;"
  -
    name: "filter_by_fundamentals"
    description: "Filter stocks based on strong fundamentals and liquidity."
    template: "SELECT ss.symbol, ss.company_name, ss.fundamental_score, ss.enhanced_fund_score FROM scores.stage_snapshots ss WHERE ss.snapshot_date = (SELECT max(snapshot_date) FROM scores.stage_snapshots) AND ss.fundamental_score >= 80 AND ss.enhanced_fund_score >= 80;"
  -
    name: "combine_results"
    description: "Combine potential breakouts with strong fundamentals."
    template: "SELECT pb.symbol, fb.company_name, pb.high, pb.week52_high, fb.fundamental_score, fb.enhanced_fund_score FROM ({{find_potential_breakouts}}) AS pb JOIN ({{filter_by_fundamentals}}) AS fb ON pb.symbol = fb.symbol;"
