    description: "Retrieve technical indicators for comparison matrix."
    sql: "SELECT symbol, snapshot_date, price, change_1w_pct, stage, technical_score, trend_signal FROM scores.stage_snapshots WHERE symbol IN (SELECT symbol FROM recent_insider_alerts UNION SELECT symbol FROM recent_bulk_deals) AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
  -
    description: "Get latest EOD data for involved symbols."
    sql: "SELECT symbol, trade_date, close, volume FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND symbol IN (SELECT symbol FROM recent_insider_alerts UNION SELECT symbol FROM recent_bulk_deals);"
