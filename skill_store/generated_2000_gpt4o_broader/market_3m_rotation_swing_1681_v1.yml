  -
    description: "Calculate index returns over the last 3 months."
    query: "SELECT index_symbol, (SUM(close) - SUM(prev_close)) / SUM(prev_close) * 100 AS index_return FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY index_symbol;"
  -
    description: "Determine the change in stage distribution for sectors over the last 3 months."
    query: "WITH StageChanges AS (SELECT sector, stage, COUNT(*) as count FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector, stage), StageStart AS (SELECT sector, stage, COUNT(*) as count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MIN(snapshot_date) FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months') GROUP BY sector, stage) SELECT StageChanges.sector, StageChanges.stage, (StageChanges.count - COALESCE(StageStart.count, 0)) as change FROM StageChanges LEFT JOIN StageStart ON StageChanges.sector = StageStart.sector AND StageChanges.stage = StageStart.stage;"
  -
    description: "Identify leading sectors based on technical scores."
    query: "SELECT sector, AVG(technical_score) as avg_technical_score FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector ORDER BY avg_technical_score DESC LIMIT 5;"
  -
    description: "Find primary swing trading candidates with high relative strength."
    query: "SELECT symbol, company_name, relative_strength FROM scores.stage2_vcp_picks WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' AND relative_strength > 70 ORDER BY relative_strength DESC LIMIT 10;"
