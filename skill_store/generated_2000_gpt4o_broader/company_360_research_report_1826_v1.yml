  financial_trends: "WITH recent_results AS (SELECT period_end, revenue, operating_profit, pat FROM scores.quarterly_results WHERE symbol = 'RELIANCE' ORDER BY period_end DESC LIMIT 5) SELECT AVG(revenue) AS avg_revenue, AVG(operating_profit) AS avg_op, AVG(pat) AS avg_pat FROM recent_results;"
  technical_setup: "SELECT trade_date, close, rsi, supertrend_value FROM market.equity_eod INNER JOIN scores.stage_snapshots ON market.equity_eod.symbol = scores.stage_snapshots.symbol WHERE market.equity_eod.symbol = 'RELIANCE' AND trade_date BETWEEN (CURRENT_DATE - INTERVAL '5 DAYS') AND CURRENT_DATE;"
  valuation_gaps: "SELECT opm_pct, tax_pct FROM scores.annual_results WHERE symbol = 'RELIANCE' AND period_label = (SELECT max(period_label) FROM scores.annual_results WHERE symbol = 'RELIANCE');"
  thesis: "SELECT narrative, key_strengths FROM scores.results_analysis WHERE symbol = 'RELIANCE' ORDER BY created_at DESC LIMIT 1;"
  risks: "SELECT key_risks, credit_rating_note FROM scores.results_analysis WHERE symbol = 'RELIANCE' ORDER BY created_at DESC LIMIT 1;"
