sql_templates:
  -
    description: "Identify top sectors by breadth signal and Stage 2 participation."
    query: "WITH breadth_rankings AS (SELECT sector, AVG(breadth_signal) AS avg_signal FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY sector), stage_participation AS (SELECT sector, AVG(stage2_pct) AS avg_stage2 FROM breadth.ma_pct_above WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY sector) SELECT b.sector, b.avg_signal, s.avg_stage2 FROM breadth_rankings b JOIN stage_participation s ON b.sector = s.sector ORDER BY b.avg_signal DESC, s.avg_stage2 DESC;"
  -
    description: "Find improving sectors with positive divergence alerts."
    query: "SELECT sector FROM breadth.sector_daily WHERE divergence_alert = 'positive' AND snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY sector;"
  -
    description: "Generate candidate symbols with RS gain in the last week."
    query: "SELECT symbol FROM scores.stage_snapshots WHERE change_1w_pct > 0 AND snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY symbol;"
  -
    description: "List symbols for TradingView with recent performance data."
    query: "SELECT e.symbol, e.close FROM market.equity_eod e JOIN scores.stage_snapshots s ON e.symbol = s.symbol WHERE e.trade_date >= CURRENT_DATE - INTERVAL '5 days' AND s.relative_strength > 70 GROUP BY e.symbol, e.close;"
