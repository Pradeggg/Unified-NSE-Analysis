    template: "WITH RecentDeals AS ( SELECT b.symbol, b.deal_date, b.qty, b.price FROM signals.bulk_block_deals b WHERE b.deal_date >= CURRENT_DATE - INTERVAL '7 days' ), InsiderAlerts AS ( SELECT i.symbol, i.alert_date, i.qty, i.insider_score FROM signals.insider_alerts i WHERE i.alert_date >= CURRENT_DATE - INTERVAL '7 days' ), TechnicalSignals AS ( SELECT s.symbol, s.trend_signal, s.supertrend_state, s.trading_signal FROM scores.stage_snapshots s WHERE s.trend_signal = 'positive' ) SELECT rd.symbol, SUM(rd.qty) AS total_qty, COUNT(ia.symbol) AS insider_count, MAX(ts.trend_signal) AS trend_signal FROM RecentDeals rd LEFT JOIN InsiderAlerts ia ON rd.symbol = ia.symbol LEFT JOIN TechnicalSignals ts ON rd.symbol = ts.symbol GROUP BY rd.symbol HAVING insider_count > 0 AND trend_signal IS NOT NULL;"
