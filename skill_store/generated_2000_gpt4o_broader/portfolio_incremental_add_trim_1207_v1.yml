    sql: "WITH LatestSnapshots AS (SELECT symbol, sector, price, stage FROM scores.stage_snapshots WHERE snapshot_date = CURRENT_DATE), CurrentHoldings AS (SELECT h.symbol, h.qty, ls.sector FROM portfolio.holdings h JOIN LatestSnapshots ls ON h.symbol = ls.symbol) SELECT ch.sector, SUM(ch.qty * ls.price) AS total_exposure FROM CurrentHoldings ch JOIN LatestSnapshots ls ON ch.symbol = ls.symbol GROUP BY ch.sector;"
  -
    template_name: "FetchAddTrimCandidates"
    description: "Fetch add and trim candidates based on technical scores and trends."
