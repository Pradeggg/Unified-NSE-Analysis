sql_templates:
  - "WITH fii_dii_flow AS (SELECT trade_date, fii_net_5d, dii_net_5d, flow_signal FROM signals.fii_dii_flows WHERE trade_date > CURRENT_DATE - INTERVAL '20 day'), regime_info AS (SELECT trade_date, regime, confidence FROM signals.regime_history WHERE trade_date > CURRENT_DATE - INTERVAL '20 day'), market_breadth AS (SELECT trade_date, advances, declines, ad_summation FROM breadth.market_daily WHERE trade_date > CURRENT_DATE - INTERVAL '20 day'), index_data AS (SELECT trade_date, index_symbol, close, change_pct FROM market.index_eod WHERE trade_date > CURRENT_DATE - INTERVAL '20 day' AND index_symbol = 'NIFTY500') SELECT fii_dii_flow.trade_date, fii_dii_flow.flow_signal, regime_info.regime, regime_info.confidence, market_breadth.advances, market_breadth.declines, market_breadth.ad_summation, index_data.close, index_data.change_pct FROM fii_dii_flow JOIN regime_info ON fii_dii_flow.trade_date = regime_info.trade_date JOIN market_breadth ON fii_dii_flow.trade_date = market_breadth.trade_date JOIN index_data ON fii_dii_flow.trade_date = index_data.trade_date ORDER BY fii_dii_flow.trade_date DESC"
