    description: "Identify improving sectors based on breadth and stage 2 participation."
    statement: "WITH recent_breadth AS (SELECT sector, AVG(pct_above_50dma) AS avg_pct_above_50dma FROM breadth.sector_daily WHERE snapshot_date >= now() - interval '3 months' GROUP BY sector), recent_stage AS (SELECT sector, AVG(stage2_pct) AS avg_stage2_pct FROM breadth.ma_pct_above WHERE snapshot_date >= now() - interval '3 months' GROUP BY sector) SELECT rb.sector, rb.avg_pct_above_50dma, rs.avg_stage2_pct FROM recent_breadth rb JOIN recent_stage rs ON rb.sector = rs.sector ORDER BY rb.avg_pct_above_50dma DESC, rs.avg_stage2_pct DESC;"
  -
    description: "Select top candidates within improving sectors based on relative strength and technical scores."
    statement: "SELECT ss.symbol, ss.company_name, ss.sector, ss.relative_strength, ss.technical_score FROM scores.stage_snapshots ss JOIN (WITH recent_top_sectors AS (SELECT sector FROM breadth.sector_daily WHERE snapshot_date >= now() - interval '3 months' GROUP BY sector ORDER BY AVG(pct_above_50dma) DESC LIMIT 5) SELECT sector FROM recent_top_sectors) rts ON ss.sector = rts.sector WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) ORDER BY ss.relative_strength DESC, ss.technical_score DESC LIMIT 10;"
