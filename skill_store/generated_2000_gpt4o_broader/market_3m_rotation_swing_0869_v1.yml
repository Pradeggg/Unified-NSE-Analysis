    template: "SELECT symbol, company_name, vcp_score FROM scores.stage2_vcp_picks WHERE snapshot_date >= CURDATE() - INTERVAL 3 MONTH AND vcp_score > 80 ORDER BY vcp_score DESC LIMIT 10;"
