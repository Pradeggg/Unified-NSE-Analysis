  -
    description: "Identify changes in stage distribution."
    template: "SELECT stage, COUNT(DISTINCT symbol) as count FROM scores.stage_snapshots WHERE snapshot_date >= CURDATE() - INTERVAL 3 MONTH GROUP BY stage;"
  -
    description: "Find leading sectors based on relative strength."
    template: "SELECT sector, AVG(relative_strength) as avg_relative_strength FROM scores.stage_snapshots WHERE snapshot_date >= CURDATE() - INTERVAL 3 MONTH GROUP BY sector ORDER BY avg_relative_strength DESC LIMIT 5;"
