sql_templates:
  -
    description: "Fetch sectors improving in stage and breadth."
    template: "SELECT sd.sector, sd.breadth_signal, sd.change_5d, ma.stage2_pct\nFROM breadth.sector_daily sd\nJOIN breadth.ma_pct_above ma ON sd.snapshot_date = ma.snapshot_date\nWHERE sd.snapshot_date >= (CURRENT_DATE - INTERVAL '5 days')\nORDER BY ma.stage2_pct DESC, sd.change_5d DESC\nLIMIT 10;"
  -
    description: "Select candidate stocks from improving sectors."
    template: "SELECT ss.symbol, ss.company_name, ss.stage, ss.trading_signal\nFROM scores.stage_snapshots ss\nJOIN (\n    SELECT DISTINCT sector\n    FROM breadth.sector_daily\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)\n    AND breadth_signal = 'IMPROVING'\n) improving_sectors ON ss.sector = improving_sectors.sector\nWHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\nAND ss.stage = 'STAGE_2'\nAND ss.trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY ss.relative_strength DESC\nLIMIT 20;"
