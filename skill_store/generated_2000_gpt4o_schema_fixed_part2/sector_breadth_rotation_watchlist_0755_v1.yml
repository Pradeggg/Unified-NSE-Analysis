    template: "WITH latest_breadth AS (\n    SELECT sector, pct_above_50dma, breadth_signal\n    FROM breadth.sector_daily\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)\n),\nlatest_stage AS (\n    SELECT sector, symbol, stage_score, trading_signal\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2'\n)\nSELECT lb.sector, lb.pct_above_50dma, lb.breadth_signal, ls.symbol, ls.trading_signal\nFROM latest_breadth lb\nLEFT JOIN latest_stage ls ON lb.sector = ls.sector\nWHERE ls.trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY lb.breadth_signal DESC, ls.stage_score DESC\nLIMIT 50;"
