    description: "Identifies stage 2 candidates with buy signals."
    sql: "SELECT snapshot_date, symbol, sector, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' AND trading_signal IN ('BUY', 'STRONG_BUY');"
