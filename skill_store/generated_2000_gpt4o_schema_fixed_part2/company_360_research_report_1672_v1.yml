tool_plan_template:
  steps:
    -
      description: "Gather the latest snapshot data for the company."
      sql:
        - "WITH latest_snapshot AS (SELECT * FROM scores.stage_snapshots WHERE symbol = '<symbol>' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots))"
    -
      description: "Fetch the latest quarterly and annual results."
      sql:
        - "WITH latest_quarterly AS (SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = '<symbol>' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC)"
        - "WITH latest_annual AS (SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE symbol = '<symbol>' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC)"
    -
      description: "Integrate balance sheet and cash flow data."
      sql:
        - "WITH latest_balance_sheet AS (SELECT * FROM scores.balance_sheet WHERE symbol = '<symbol>' ORDER BY period_end DESC LIMIT 1)"
        - "WITH latest_cash_flow AS (SELECT * FROM scores.cash_flow WHERE symbol = '<symbol>' ORDER BY period_end DESC LIMIT 1)"
    -
      description: "Compile an overview using the results analysis and EOD market data."
      sql:
        - "WITH latest_results_analysis AS (SELECT DISTINCT ON (symbol) * FROM scores.results_analysis WHERE symbol = '<symbol>' ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC)"
        - "WITH latest_eod AS (SELECT * FROM market.equity_eod WHERE symbol = '<symbol>' AND trade_date = (SELECT MAX(trade_date) FROM market.equity_eod))"
