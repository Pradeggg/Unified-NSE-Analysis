    template_name: "InsiderAndBulkDealsReview"
    query: "WITH latest_stage AS ( SELECT symbol, stage, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND trading_signal IN ('BUY', 'STRONG_BUY') ), latest_eod AS ( SELECT symbol, close, change_pct FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND series = 'EQ' ), insider_context AS ( SELECT ia.symbol, ia.alert_date, ia.entity, ia.qty, ia.value_cr, ia.insider_score FROM signals.insider_alerts ia WHERE alert_date = (SELECT MAX(alert_date) FROM signals.insider_alerts) ), bulk_deals_context AS ( SELECT bb.symbol, bb.deal_date, bb.side, bb.qty, bb.price FROM signals.bulk_block_deals bb WHERE deal_date = (SELECT MAX(deal_date) FROM signals.bulk_block_deals) ) SELECT ls.symbol, ls.stage, ls.trading_signal, le.close, le.change_pct, ic.qty AS insider_qty, ic.value_cr AS insider_value_cr, ic.insider_score, bd.side AS bulk_side, bd.qty AS bulk_qty, bd.price AS bulk_price FROM latest_stage ls JOIN latest_eod le ON ls.symbol = le.symbol LEFT JOIN insider_context ic ON ls.symbol = ic.symbol LEFT JOIN bulk_deals_context bd ON ls.symbol = bd.symbol LIMIT 100;"
