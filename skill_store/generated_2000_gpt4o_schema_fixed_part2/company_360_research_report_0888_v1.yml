tool_plan_template: "Generate a comprehensive analysis for {{symbol}} by aggregating financials from latest quarterly and annual results, balance sheet, and cash flow. Include latest technical indicators and stage snapshots for market context."
sql_templates:
  latest_stage_snapshot: "WITH latest_snapshot AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND symbol = {{symbol}}) SELECT company_name, sector, market_cap_cat, price, rsi, trend_signal, stage, trading_signal FROM latest_snapshot;"
  financial_summary: "WITH latest_quarter AS (SELECT * FROM scores.quarterly_results WHERE symbol = {{symbol}} AND period_type = 'quarter' ORDER BY period_end DESC LIMIT 1), latest_annual AS (SELECT * FROM scores.annual_results WHERE symbol = {{symbol}} ORDER BY period_end DESC LIMIT 1) SELECT q.revenue AS quarterly_revenue, q.pat AS quarterly_pat, a.revenue AS annual_revenue, a.pat AS annual_pat FROM latest_quarter q JOIN latest_annual a ON q.symbol = a.symbol;"
  balance_sheet_analysis: "SELECT symbol, equity_capital, total_assets, borrowings, net_debt FROM scores.balance_sheet WHERE symbol = {{symbol}} ORDER BY period_end DESC LIMIT 1;"
  cash_flow_summary: "SELECT symbol, operating_cf, investing_cf, financing_cf, net_cf FROM scores.cash_flow WHERE symbol = {{symbol}} ORDER BY period_end DESC LIMIT 1;"
