      sql: "WITH recent_alerts AS (\n    SELECT ia.symbol, ia.alert_date, ia.entity, ia.qty, ia.value_cr, ia.insider_score \n    FROM signals.insider_alerts ia \n    WHERE ia.alert_date >= CURRENT_DATE - INTERVAL '3 months'\n),\nrecent_deals AS (\n    SELECT bd.symbol, bd.deal_date, bd.entity, bd.qty, bd.price \n    FROM signals.bulk_block_deals bd \n    WHERE bd.deal_date >= CURRENT_DATE - INTERVAL '3 months'\n),\nlatest_stages AS (\n    SELECT ss.symbol, ss.trading_signal, ss.technical_score, ss.snapshot_date\n    FROM scores.stage_snapshots ss\n    WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n)\nSELECT ra.symbol, ra.alert_date, ra.entity, ra.qty, ra.value_cr, ls.trading_signal, ls.technical_score \nFROM recent_alerts ra\nJOIN latest_stages ls ON ra.symbol = ls.symbol\nWHERE ls.trading_signal IN ('BUY', 'STRONG_BUY')\nUNION ALL\nSELECT rd.symbol, rd.deal_date, rd.entity, rd.qty, rd.price, ls.trading_signal, ls.technical_score \nFROM recent_deals rd\nJOIN latest_stages ls ON rd.symbol = ls.symbol\nWHERE ls.trading_signal IN ('BUY', 'STRONG_BUY')\nLIMIT 50;"
