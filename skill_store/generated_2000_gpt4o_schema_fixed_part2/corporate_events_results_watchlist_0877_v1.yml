    query: "\nWITH latest_stage_snapshots AS (\n    SELECT \n        symbol, \n        sector, \n        stage, \n        trading_signal, \n        snapshot_date \n    FROM \n        scores.stage_snapshots\n    WHERE \n        snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n        AND trading_signal IN ('BUY', 'STRONG_BUY')\n),\nlatest_corporate_events AS (\n    SELECT \n        id, \n        symbol, \n        event_type, \n        event_date\n    FROM \n        signals.corporate_events\n    WHERE \n        event_date >= CURRENT_DATE\n        OR event_date = (SELECT MAX(event_date) FROM signals.corporate_events)\n),\nlatest_results_analysis AS (\n    SELECT DISTINCT ON (symbol)\n        symbol, \n        period_end, \n        verdict\n    FROM \n        scores.results_analysis\n    ORDER BY \n        symbol, period_end DESC NULLS LAST, updated_at DESC\n)\nSELECT \n    e.symbol,\n    e.event_type,\n    e.event_date,\n    r.verdict,\n    s.stage,\n    s.trading_signal\nFROM \n    latest_corporate_events e\nJOIN \n    latest_stage_snapshots s ON e.symbol = s.symbol\nLEFT JOIN \n    latest_results_analysis r ON e.symbol = r.symbol\nWHERE \n    e.event_type IN ('RESULTS', 'DIVIDEND', 'SPLIT', 'BONUS', 'AGM')\nLIMIT 50;\n"
