    sql: "WITH latest_stage AS (SELECT sector, stage, COUNT(*) AS stage2_count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector, stage), sector_breadth AS (SELECT sector, AVG(change_5d) AS avg_change_5d FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) GROUP BY sector) SELECT sb.sector, sb.avg_change_5d, ls.stage2_count FROM sector_breadth sb JOIN latest_stage ls ON sb.sector = ls.sector ORDER BY ls.stage2_count DESC, sb.avg_change_5d DESC LIMIT 10;"
