    name: "fii_dii_regime_breadth_query"
    description: "Fetch data for FII/DII flows, market regime, breadth, and index for last 5 sessions."
    query: "WITH latest_data AS ( \n    SELECT MAX(trade_date) as max_date \n    FROM signals.fii_dii_flows \n), \nflow_data AS ( \n    SELECT trade_date, fii_net_5d, dii_net_5d, flow_signal \n    FROM signals.fii_dii_flows \n    WHERE trade_date >= (SELECT max_date FROM latest_data) - INTERVAL '4 days' \n), \nregime_data AS ( \n    SELECT trade_date, regime, confidence \n    FROM signals.regime_history \n    WHERE trade_date >= (SELECT max_date FROM latest_data) - INTERVAL '4 days' \n), \nbreadth_data AS ( \n    SELECT trade_date, advances, declines, ad_signal \n    FROM breadth.market_daily \n    WHERE trade_date >= (SELECT max_date FROM latest_data) - INTERVAL '4 days' \n), \nindex_data AS ( \n    SELECT trade_date, index_symbol, close, change_pct \n    FROM market.index_eod \n    WHERE trade_date >= (SELECT max_date FROM latest_data) - INTERVAL '4 days' AND index_symbol = 'Nifty 50' \n) \nSELECT fd.trade_date, fd.fii_net_5d, fd.dii_net_5d, fd.flow_signal, rd.regime, rd.confidence, bd.advances, bd.declines, bd.ad_signal, id.close, id.change_pct \nFROM flow_data fd \nJOIN regime_data rd ON fd.trade_date = rd.trade_date \nJOIN breadth_data bd ON fd.trade_date = bd.trade_date \nJOIN index_data id ON fd.trade_date = id.trade_date;"
