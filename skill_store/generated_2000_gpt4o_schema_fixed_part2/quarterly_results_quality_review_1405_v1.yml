      description: "Fetch the latest stage and technical indicators for context."
      sql_template:
        query: "SELECT s.symbol, s.stage, s.trading_signal FROM scores.stage_snapshots s WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND s.trading_signal IN ('BUY', 'STRONG_BUY');"
