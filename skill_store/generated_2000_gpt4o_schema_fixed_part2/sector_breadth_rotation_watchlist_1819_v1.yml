      template: "WITH latest_sector_data AS (SELECT sector, pct_above_50dma, change_5d, breadth_signal, divergence_alert FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)), latest_ma_data AS (SELECT pct_above_20dma, pct_above_50dma, pct_above_100dma, pct_above_200dma FROM breadth.ma_pct_above WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.ma_pct_above)), latest_stage_data AS (SELECT sector, symbol, stage_score, relative_strength, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' AND trading_signal IN ('BUY', 'STRONG_BUY')), eod_data AS (SELECT symbol, close, change_pct FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND series = 'EQ') SELECT ls.sector, ls.pct_above_50dma, ls.change_5d, ls.breadth_signal, ls.divergence_alert, ld.pct_above_20dma, ld.pct_above_100dma, sd.symbol, sd.stage_score, sd.relative_strength, sd.trading_signal, ed.close, ed.change_pct FROM latest_sector_data ls JOIN latest_stage_data sd ON ls.sector = sd.sector LEFT JOIN latest_ma_data ld ON TRUE LEFT JOIN eod_data ed ON sd.symbol = ed.symbol LIMIT 50;"
      outputs:
        - "sector_ranks"
        - "improving_sectors"
        - "candidate_symbols"
        - "tradingview_symbols"
