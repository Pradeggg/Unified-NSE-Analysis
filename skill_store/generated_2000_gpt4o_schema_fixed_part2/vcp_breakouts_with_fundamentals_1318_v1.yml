    template_sql: "\nWITH latest_eod AS (\n    SELECT *\n    FROM market.equity_eod\n    WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)\n    AND series = 'EQ'\n),\nlatest_snapshots AS (\n    SELECT *\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n),\nlatest_vcp AS (\n    SELECT *\n    FROM scores.stage2_vcp_picks\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)\n)\nSELECT eod.symbol, eod.close, sh.stage, sh.trading_signal, vcp.vcp_score, sh.enhanced_fund_score\nFROM latest_eod eod\nJOIN latest_snapshots sh ON eod.symbol = sh.symbol\nJOIN latest_vcp vcp ON eod.symbol = vcp.symbol\nWHERE sh.stage = 'STAGE_2'\nAND sh.trading_signal IN ('BUY', 'STRONG_BUY')\nAND sh.enhanced_fund_score >= 80\nORDER BY vcp.vcp_score DESC\nLIMIT 10;\n"
