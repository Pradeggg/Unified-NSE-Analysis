  add_candidates: "SELECT h.symbol, s.company_name, s.trading_signal FROM portfolio.holdings h INNER JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(s.snapshot_date) FROM scores.stage_snapshots) AND s.trading_signal IN ('BUY', 'STRONG_BUY') LIMIT 10"
  trim_candidates: "SELECT h.symbol, s.company_name, s.trading_signal FROM portfolio.holdings h INNER JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(s.snapshot_date) FROM scores.stage_snapshots) AND s.trading_signal = 'SELL' LIMIT 10"
  risk_flags: "SELECT h.symbol, s.company_name, s.rsi, s.relative_strength FROM portfolio.holdings h INNER JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND (s.rsi > 70 OR s.relative_strength < 30) LIMIT 10"
