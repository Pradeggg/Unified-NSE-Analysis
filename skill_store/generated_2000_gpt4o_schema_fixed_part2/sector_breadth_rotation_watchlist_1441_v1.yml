sql_templates:
  -
    description: "Identify sectors with improving breadth and Stage 2 participation."
    query: "WITH latest_breadth AS (\n    SELECT sector, AVG(pct_above_50dma::numeric) AS avg_pct_above_50dma\n    FROM breadth.sector_daily\n    WHERE snapshot_date > CURRENT_DATE - INTERVAL '3 months'\n    GROUP BY sector\n), latest_stage AS (\n    SELECT sector, COUNT(*) AS stage2_count\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n    AND stage = 'STAGE_2'\n    GROUP BY sector\n)\nSELECT b.sector, b.avg_pct_above_50dma, s.stage2_count\nFROM latest_breadth b\nJOIN latest_stage s ON b.sector = s.sector\nORDER BY s.stage2_count DESC, b.avg_pct_above_50dma DESC\nLIMIT 5;"
  -
    description: "Get candidate symbols from the top sectors."
    query: "SELECT ss.symbol, ss.company_name, ss.stage_score\nFROM scores.stage_snapshots ss\nJOIN (\n    SELECT sector\n    FROM (\n        SELECT b.sector, s.stage2_count\n        FROM (\n            SELECT sector, AVG(pct_above_50dma::numeric) AS avg_pct_above_50dma\n            FROM breadth.sector_daily\n            WHERE snapshot_date > CURRENT_DATE - INTERVAL '3 months'\n            GROUP BY sector\n        ) b\n        JOIN (\n            SELECT sector, COUNT(*) AS stage2_count\n            FROM scores.stage_snapshots\n            WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n            AND stage = 'STAGE_2'\n            GROUP BY sector\n        ) s ON b.sector = s.sector\n    ) subquery\n    ORDER BY stage2_count DESC\n    LIMIT 3\n) top_sectors ON ss.sector = top_sectors.sector\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\nAND ss.stage = 'STAGE_2'\nAND ss.trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY ss.stage_score DESC\nLIMIT 10;"
