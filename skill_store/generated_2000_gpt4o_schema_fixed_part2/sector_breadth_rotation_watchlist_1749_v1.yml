  sector_ranks: "WITH latest_sector_data AS (SELECT sector, pct_above_50dma, change_5d, breadth_signal FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)), stage_two_sectors AS (SELECT sector, AVG(stage_score) AS avg_stage_score FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector) SELECT l.sector, l.pct_above_50dma, l.change_5d, l.breadth_signal, s.avg_stage_score FROM latest_sector_data l JOIN stage_two_sectors s ON l.sector = s.sector ORDER BY s.avg_stage_score DESC;"
  improving_sectors: "SELECT sector FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' AND change_5d > 0 GROUP BY sector HAVING COUNT(*) > 5 ORDER BY AVG(change_5d) DESC;"
  candidate_symbols: "SELECT symbol, company_name, relative_strength, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND sector IN (SELECT sector FROM improving_sectors) AND trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY relative_strength DESC LIMIT 20;"
  tradingview_symbols: "SELECT DISTINCT(symbol) FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND symbol IN (SELECT symbol FROM candidate_symbols);"
