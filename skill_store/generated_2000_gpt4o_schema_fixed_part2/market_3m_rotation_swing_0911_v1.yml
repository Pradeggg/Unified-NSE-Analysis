  -
    id: "stage_change_analysis"
    description: "Identify changes in stage distribution."
    template: "SELECT stage, COUNT(symbol) AS count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY stage"
  -
    id: "leading_sectors_query"
    description: "Find leading sectors based on recent performance."
    template: "SELECT sector, AVG(change_1m_pct) AS avg_change FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_change DESC LIMIT 5"
  -
    id: "primary_candidates_query"
    description: "Identify primary swing trade candidates."
    template: "WITH stage2_candidates AS (SELECT symbol, stage_score FROM scores.stage_snapshots WHERE stage = 'STAGE_2' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT market.equity_eod.symbol, close FROM market.equity_eod JOIN stage2_candidates ON market.equity_eod.symbol = stage2_candidates.symbol WHERE market.equity_eod.trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) ORDER BY stage_score DESC LIMIT 10"
