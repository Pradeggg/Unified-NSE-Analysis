    description: "Select symbols with recent or upcoming corporate events and results."
    sql: "WITH recent_events AS (\n  SELECT symbol, event_type, event_date, detail, source\n  FROM signals.corporate_events\n  WHERE event_date >= CURRENT_DATE - INTERVAL '1 week'\n  AND event_date <= CURRENT_DATE + INTERVAL '1 week'\n), recent_results AS (\n  SELECT DISTINCT ON (symbol) symbol, period_end, verdict, score\n  FROM scores.results_analysis\n  ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC\n), symbol_context AS (\n  SELECT s.symbol, s.company_name, s.stage, s.trading_signal\n  FROM scores.stage_snapshots s\n  WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n)\nSELECT e.symbol, e.event_type, e.event_date, r.verdict, r.score, sc.stage, sc.trading_signal\nFROM recent_events e\nLEFT JOIN recent_results r ON e.symbol = r.symbol\nLEFT JOIN symbol_context sc ON e.symbol = sc.symbol\nLIMIT 50;"
