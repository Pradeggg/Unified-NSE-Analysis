    template: "WITH recent_insider_alerts AS (SELECT symbol, MAX(alert_date) AS latest_alert_date FROM signals.insider_alerts WHERE alert_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY symbol), recent_bulk_deals AS (SELECT symbol, MAX(deal_date) AS latest_deal_date FROM signals.bulk_block_deals WHERE deal_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY symbol) SELECT a.symbol, a.latest_alert_date, b.latest_deal_date, s.stage, s.trading_signal FROM recent_insider_alerts a INNER JOIN recent_bulk_deals b ON a.symbol = b.symbol INNER JOIN scores.stage_snapshots s ON a.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND s.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY s.trading_signal DESC LIMIT 50;"
