sql_templates:
  -
    description: "Rank sectors by breadth signal and Stage 2 participation in the last 3 months."
    template: "WITH recent_breadth AS (SELECT sector, AVG(pct_above_50dma::numeric) AS avg_pct_above_50dma, AVG(change_5d::numeric) AS avg_change_5d FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector),\nrecent_stage AS (SELECT sector, AVG(stage2_pct) AS avg_stage2_pct FROM breadth.ma_pct_above WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector)\nSELECT rb.sector, rb.avg_pct_above_50dma, rb.avg_change_5d, rs.avg_stage2_pct FROM recent_breadth rb JOIN recent_stage rs ON rb.sector = rs.sector ORDER BY rs.avg_stage2_pct DESC, rb.avg_pct_above_50dma DESC LIMIT 10;"
  -
    description: "Select candidate stocks in top-ranked sectors with strong buy signals."
    template: "SELECT ss.symbol, ss.company_name, ss.sector, ss.trading_signal FROM scores.stage_snapshots ss WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') AND ss.sector IN (SELECT sector FROM (SELECT sector, AVG(stage2_pct) AS avg_stage2_pct FROM breadth.ma_pct_above WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector ORDER BY avg_stage2_pct DESC LIMIT 5) subquery) ORDER BY ss.relative_strength DESC LIMIT 20;"
