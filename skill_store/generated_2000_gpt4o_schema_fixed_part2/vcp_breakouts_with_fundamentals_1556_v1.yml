    description: "Identify VCP breakout stocks with strong fundamentals for the quarter to date."
    query: "WITH latest_snapshot AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), latest_vcp AS (SELECT * FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)) SELECT e.symbol, e.company_name, e.sector, e.price, e.change_1d_pct, e.change_1w_pct, e.market_cap_cr FROM market.equity_eod e JOIN latest_snapshot s ON e.symbol = s.symbol JOIN latest_vcp v ON e.symbol = v.symbol WHERE e.trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND s.trading_signal IN ('BUY', 'STRONG_BUY') AND v.vcp_score > 80 ORDER BY v.vcp_score DESC LIMIT 50;"
