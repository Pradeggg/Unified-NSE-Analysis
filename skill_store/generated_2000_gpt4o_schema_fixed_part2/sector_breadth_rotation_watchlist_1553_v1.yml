    sql: "WITH latest_snapshot AS (SELECT MAX(snapshot_date) AS max_date FROM breadth.sector_daily), \nsectors_with_breadth AS (\n  SELECT \n    sd.sector, \n    sd.pct_above_50dma, \n    sd.change_5d, \n    sd.breadth_signal, \n    ma.stage2_pct \n  FROM \n    breadth.sector_daily sd \n  JOIN \n    breadth.ma_pct_above ma \n  ON \n    sd.snapshot_date = ma.snapshot_date \n  JOIN \n    scores.stage_snapshots ss \n  ON \n    sd.sector = ss.sector \n  WHERE \n    sd.snapshot_date = (SELECT max_date FROM latest_snapshot) \n    AND ss.stage = 'STAGE_2'\n    AND ma.stage2_pct > 50\n)\nSELECT \n  sector, \n  MAX(pct_above_50dma) AS max_pct_above_50dma, \n  MAX(change_5d) AS max_change_5d, \n  MAX(stage2_pct) AS max_stage2_pct \nFROM \n  sectors_with_breadth \nGROUP BY \n  sector \nORDER BY \n  max_stage2_pct DESC, \n  max_change_5d DESC \nLIMIT 5;"
