    sql: "SELECT b.sector, b.pct_above_50dma, m.stage2_pct FROM breadth.sector_daily b JOIN breadth.ma_pct_above m ON b.snapshot_date = m.snapshot_date WHERE b.snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) ORDER BY m.stage2_pct DESC, b.pct_above_50dma DESC LIMIT 5"
    description: "Rank sectors by highest Stage 2 participation and percentage above moving averages."
