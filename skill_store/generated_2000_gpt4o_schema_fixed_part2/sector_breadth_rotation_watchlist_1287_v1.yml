    sql: "WITH latest_breadth AS (SELECT sector, pct_above_50dma, change_5d FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)), latest_stage AS (SELECT sector, COUNT(*) AS stage2_count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector) SELECT b.sector FROM latest_breadth b JOIN latest_stage s ON b.sector = s.sector WHERE b.change_5d > 0 AND s.stage2_count > 5"
