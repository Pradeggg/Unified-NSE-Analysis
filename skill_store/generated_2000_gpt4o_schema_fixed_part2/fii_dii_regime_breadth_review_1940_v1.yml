    statement: "WITH latest_flows AS (\n    SELECT trade_date, fii_net_today, dii_net_today,\n           fi_trend, di_trend\n    FROM signals.fii_dii_flows\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '20 days'\n),\nlatest_regime AS (\n    SELECT trade_date, regime, confidence\n    FROM signals.regime_history\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '20 days'\n),\nlatest_breadth AS (\n    SELECT trade_date, adv_volume, dec_volume, ad_signal\n    FROM breadth.market_daily\n    WHERE trade_date >= CURRENT_DATE - INTERVAL '20 days'\n),\nlatest_index AS (\n    SELECT trade_date, close, change_pct, trend_signal\n    FROM market.index_eod\n    WHERE index_symbol = 'Nifty 50' AND trade_date >= CURRENT_DATE - INTERVAL '20 days'\n)\nSELECT f.trade_date, f.fii_net_today, f.dii_net_today,\n       r.regime, r.confidence,\n       b.adv_volume, b.dec_volume, b.ad_signal,\n       i.close, i.change_pct, i.trend_signal\nFROM latest_flows f\nJOIN latest_regime r ON f.trade_date = r.trade_date\nJOIN latest_breadth b ON f.trade_date = b.trade_date\nJOIN latest_index i ON f.trade_date = i.trade_date\nORDER BY f.trade_date DESC;"
