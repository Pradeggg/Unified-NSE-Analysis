  -
    name: "get_trim_candidates"
    sql: "SELECT ph.symbol, ss.trading_signal FROM portfolio.holdings ph JOIN scores.stage_snapshots ss ON ph.symbol = ss.symbol WHERE ss.trading_signal = 'SELL' AND ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
