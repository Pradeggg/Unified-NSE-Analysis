tool_plan_template:
  python:

  sql:
    -
      name: "IndexReturns"
      description: "Calculate percentage returns for indices over the last 3 months."
      template: "WITH latest_index AS (SELECT * FROM market.index_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.index_eod)), last_3_months_index AS (SELECT * FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months') SELECT index_symbol, ((latest_index.close / MIN(last_3_months_index.close)) - 1) * 100 AS index_returns_pct FROM latest_index JOIN last_3_months_index ON latest_index.index_symbol = last_3_months_index.index_symbol GROUP BY index_symbol;"
    -
      name: "StageDistributionChange"
      description: "Assess change in stage distribution."
      template: "WITH latest_snapshot AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT stage, COUNT(*) AS stage_count FROM latest_snapshot GROUP BY stage;"
    -
      name: "LeadingSectors"
      description: "Identify leading sectors based on stage 2 leadership."
      template: "WITH latest_snapshot AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), stage_2 AS (SELECT sector, COUNT(*) AS count FROM latest_snapshot WHERE stage = 'STAGE_2' GROUP BY sector) SELECT sector FROM stage_2 ORDER BY count DESC LIMIT 5;"
    -
      name: "PrimaryCandidates"
      description: "Retrieve top candidates for swing trading based on VCP picks."
      template: "WITH latest_vcp AS (SELECT * FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)) SELECT symbol, company_name, sector, vcp_score FROM latest_vcp ORDER BY vcp_score DESC LIMIT 10;"
