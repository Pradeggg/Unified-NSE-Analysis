    title: "Sector Breadth and Stage Participation"
    description: "Fetch sectors with improving breadth and stage participation in the last 20 sessions."
    template: "WITH latest_snapshots AS (SELECT MAX(snapshot_date) AS latest_date FROM scores.stage_snapshots),\nbreadth_data AS (\n    SELECT \n        sd.sector, \n        sd.pct_above_50dma,\n        ma.stage2_pct\n    FROM \n        breadth.sector_daily sd\n    JOIN \n        breadth.ma_pct_above ma ON sd.snapshot_date = ma.snapshot_date\n    WHERE \n        sd.snapshot_date >= (CURRENT_DATE - INTERVAL '20 days')\n),\nstage_2_sectors AS (\n    SELECT \n        ss.sector,\n        COUNT(ss.symbol) AS stage_2_count\n    FROM \n        scores.stage_snapshots ss\n    WHERE \n        ss.stage = 'STAGE_2' AND \n        ss.snapshot_date = (SELECT latest_date FROM latest_snapshots)\n    GROUP BY \n        ss.sector\n)\nSELECT \n    bd.sector,\n    bd.pct_above_50dma,\n    stage_2_count\nFROM \n    breadth_data bd\nLEFT JOIN \n    stage_2_sectors s2 ON bd.sector = s2.sector\nORDER BY \n    pct_above_50dma DESC, \n    stage_2_count DESC \nLIMIT 10;"
