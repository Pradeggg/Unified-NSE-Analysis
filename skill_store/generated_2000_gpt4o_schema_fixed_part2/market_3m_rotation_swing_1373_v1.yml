    template: "WITH three_months_data AS (\n    SELECT index_symbol, close as close_price, trade_date\n    FROM market.index_eod\n    WHERE trade_date BETWEEN CURRENT_DATE - INTERVAL '3 months' AND CURRENT_DATE\n)\nSELECT index_symbol, \n       (SELECT close_price FROM three_months_data ORDER BY trade_date DESC LIMIT 1) / \n       (SELECT close_price FROM three_months_data ORDER BY trade_date ASC LIMIT 1) - 1 AS return_pct\nFROM three_months_data\nGROUP BY index_symbol\nLIMIT 100;"
    description: "Calculates the percentage return of indexes over the past 3 months."
  stage_distribution_change:
    template: "SELECT sector, COUNT(*) as stage_2_count\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n  AND stage = 'STAGE_2'\nGROUP BY sector\nORDER BY stage_2_count DESC;"
    description: "Determines the number of stage 2 stocks by sector."
  leading_sectors:
    template: "SELECT sector\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n  AND stage = 'STAGE_2'\nGROUP BY sector\nORDER BY COUNT(*) DESC\nLIMIT 3;"
    description: "Finds leading sectors based on stage 2 stocks."
  primary_candidates:
    template: "SELECT symbol, company_name, vcp_score\nFROM scores.stage2_vcp_picks\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)\nORDER BY vcp_score DESC\nLIMIT 10;"
