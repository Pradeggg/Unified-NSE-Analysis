    description: "Get current stage and trading signals for the symbol involving events."
    template: "SELECT s.symbol, s.stage, s.trading_signal FROM scores.stage_snapshots s JOIN signals.corporate_events e ON s.symbol = e.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND e.event_date >= CURRENT_DATE ORDER BY s.symbol LIMIT 50;"
