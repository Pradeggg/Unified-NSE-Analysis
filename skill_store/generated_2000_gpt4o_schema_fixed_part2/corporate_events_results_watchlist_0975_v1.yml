    name: "RecentResultsAnalysis"
    description: "Get the latest results analysis based on predefined period and verdict."
    template: "WITH LatestAnalysis AS (SELECT DISTINCT ON (symbol) symbol, period_end, verdict, score FROM scores.results_analysis ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC) SELECT symbol, period_end, verdict, score FROM LatestAnalysis WHERE period_end >= CURRENT_DATE - INTERVAL '3 months' AND verdict IS NOT NULL LIMIT 50;"
