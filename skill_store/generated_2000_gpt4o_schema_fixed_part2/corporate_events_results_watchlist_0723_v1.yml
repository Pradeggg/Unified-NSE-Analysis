sql_templates:
  -
    name: "fetch_recent_events"
    description: "Select recent corporate events from the last 5 sessions."
    sql: "SELECT symbol, event_type, event_date, detail FROM signals.corporate_events WHERE event_date >= CURRENT_DATE - INTERVAL '5 days';"
  -
    name: "latest_results_analysis"
    description: "Retrieve the latest results analysis for the symbols from recent events."
    sql: "SELECT DISTINCT ON (symbol) symbol, period_end, company_name, verdict, pl_commentary FROM scores.results_analysis WHERE symbol IN (SELECT symbol FROM signals.corporate_events WHERE event_date >= CURRENT_DATE - INTERVAL '5 days') ORDER BY symbol, period_end DESC, updated_at DESC;"
  -
    name: "current_stage_context"
    description: "Join corporate events with the latest snapshot to get current stage details."
    sql: "SELECT a.symbol, a.event_type, a.event_date, a.detail, b.stage, b.trading_signal FROM signals.corporate_events a JOIN scores.stage_snapshots b ON a.symbol = b.symbol WHERE a.event_date >= CURRENT_DATE - INTERVAL '5 days' AND b.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
