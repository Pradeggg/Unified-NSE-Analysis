tool_plan_template:
  as_of_date: "SELECT MAX(trade_date) AS as_of_date FROM market.index_eod;"
  index_returns: "SELECT index_symbol, ROUND((close - LAG(close, 1) OVER (PARTITION BY index_symbol ORDER BY trade_date)) / LAG(close, 1) OVER (PARTITION BY index_symbol ORDER BY trade_date) * 100, 2) AS change_pct FROM market.index_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.index_eod);"
  stage_distribution_change: "SELECT sector, COUNT(CASE WHEN stage = 'STAGE_2' THEN 1 END) AS stage_2_count_last, COUNT(CASE WHEN stage = 'STAGE_2' AND snapshot_date = (CURRENT_DATE - INTERVAL '3 months') THEN 1 END) AS stage_2_count_3m_ago FROM scores.stage_snapshots WHERE snapshot_date IN ((SELECT MAX(snapshot_date) FROM scores.stage_snapshots), (SELECT MAX(snapshot_date) FROM scores.stage_snapshots WHERE snapshot_date = (CURRENT_DATE - INTERVAL '3 months'))) GROUP BY sector;"
  leading_sectors: "SELECT sector, COUNT(symbol) AS num_stocks FROM scores.stage_snapshots WHERE stage = 'STAGE_2' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY num_stocks DESC LIMIT 3;"
  primary_candidates: "SELECT symbol, company_name, rank FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) ORDER BY vcp_score DESC LIMIT 5;"
  risks: "SELECT index_symbol, COUNT(CASE WHEN trading_signal = 'SELL' THEN 1 END) AS sell_signals FROM market.index_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.index_eod) GROUP BY index_symbol;"
