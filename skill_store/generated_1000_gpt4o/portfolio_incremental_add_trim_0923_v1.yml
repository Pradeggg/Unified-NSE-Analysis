sql_templates:
  -
    name: "Compute Portfolio State"
    query: "SELECT h.symbol, h.qty, h.avg_cost, s.stage, s.stage_score FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS s ON h.symbol = s.symbol WHERE s.snapshot_date >= CURRENT_DATE - INTERVAL '5 days';"
  -
    name: "Analyze Sector Exposure"
    query: "SELECT s.sector, SUM(h.qty * s.live_price) AS sector_value FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS s ON h.symbol = s.symbol WHERE s.snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY s.sector;"
  -
    name: "Identify Add Candidates"
    query: "SELECT s.symbol, s.company_name, s.change_1w_pct, s.trend_signal FROM scores.stage_snapshots AS s WHERE s.snapshot_date >= CURRENT_DATE - INTERVAL '5 days' AND s.change_1w_pct > 5 AND s.trend_signal = 'uptrend';"
  -
    name: "Identify Trim Candidates"
    query: "SELECT s.symbol, s.company_name, s.change_1w_pct, s.trend_signal FROM scores.stage_snapshots AS s WHERE s.snapshot_date >= CURRENT_DATE - INTERVAL '5 days' AND s.change_1w_pct < -5 AND s.trend_signal = 'downtrend';"
  -
    name: "Highlight Risk Flags"
    query: "SELECT s.symbol, s.company_name, s.rsi, s.supertrend_state FROM scores.stage_snapshots AS s WHERE s.snapshot_date >= CURRENT_DATE - INTERVAL '5 days' AND s.rsi > 70 OR s.supertrend_state = 'sell';"
