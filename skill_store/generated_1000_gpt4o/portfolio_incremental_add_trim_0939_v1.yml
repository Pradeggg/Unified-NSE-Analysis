    template: "WITH recent_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date IN (SELECT DISTINCT snapshot_date FROM scores.stage_snapshots ORDER BY snapshot_date DESC LIMIT 20)) SELECT symbol FROM recent_snapshots WHERE stage_score < 4 OR trend_signal = 'DOWN'"
