sql_templates:
  -
    context: "Identify breakouts with strong fundamentals quarter to date."
    query:
      - "WITH breakout_candidates AS ("
      - "    SELECT symbol, company_name, sector, week52_high, close, market_cap_cr"
      - "    FROM market.equity_eod"
      - "    WHERE close > 0.95 * week52_high"
      - "    AND trade_date BETWEEN DATE_TRUNC('quarter', CURRENT_DATE) AND CURRENT_DATE"
      - "    AND market_cap_cr > 100000"
      - ")"
      - "SELECT sc.symbol, sc.company_name, sc.sector, sc.fundamental_score, sp.vcp_score"
      - "FROM scores.stage_snapshots sc"
      - "JOIN breakout_candidates bc ON sc.symbol = bc.symbol"
      - "JOIN scores.stage2_vcp_picks sp ON sc.symbol = sp.symbol"
      - "WHERE sc.enhanced_fund_score > 70"
      - "AND sp.vcp_score > 80"
      - "AND sc.snapshot_date = sp.snapshot_date"
      - "AND sc.snapshot_date > current_date - interval '90' day"
