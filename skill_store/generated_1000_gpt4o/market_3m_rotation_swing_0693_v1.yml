tool_plan_template: "Read data from approved tables to identify markets' active sectors, regime, and potential swing trading candidates. Focus on recent 3-month period trends and stage 2 leadership insights."
sql_templates:
  -
    query_name: "IndexChangesLast3Months"
    query: "WITH IndexPerformance AS (SELECT trade_date, index_symbol, close, change_pct FROM market.index_eod WHERE trade_date >= DATE_SUB(CURRENT_DATE, INTERVAL 3 MONTH)), LatestPerformance AS (SELECT index_symbol, MAX(trade_date) as latest_date FROM IndexPerformance GROUP BY index_symbol) SELECT ip.index_symbol, ip.trade_date, ip.close, ip.change_pct FROM IndexPerformance ip JOIN LatestPerformance lp ON ip.index_symbol = lp.index_symbol AND ip.trade_date = lp.latest_date ORDER BY ip.change_pct DESC;"
  -
    query_name: "SectorLeadership"
    query: "SELECT sector, AVG(stage_score) as avg_stage_score FROM scores.stage_snapshots WHERE snapshot_date >= DATE_SUB(CURRENT_DATE, INTERVAL 3 MONTH) GROUP BY sector ORDER BY avg_stage_score DESC LIMIT 5;"
  -
    query_name: "Stage2VCPPicks"
    query: "SELECT symbol, company_name, sector, price, change_1w_pct, trading_signal FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) AND stage = 2 AND investment_score > 75 ORDER BY change_1w_pct DESC LIMIT 10;"
