  add_candidates:
    description: "Identify potential candidates for adding positions."
    query: "SELECT symbol, company_name FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days' AND trading_signal = 'buy' AND relative_strength > 70;"
  portfolio_state:
    description: "Fetch portfolio state with recent market changes."
    query: "WITH recent_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days') SELECT symbol, SUM(qty) AS total_qty, AVG(avg_cost) AS avg_cost FROM portfolio.holdings WHERE symbol IN (SELECT symbol FROM recent_snapshots) GROUP BY symbol;"
  risk_flags:
    description: "Highlight stocks with high risk based on supertrend signals."
    query: "SELECT symbol, supertrend_state FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days' AND supertrend_state = 'downtrend';"
  sector_exposure:
    description: "Calculate sector exposure based on current holdings."
    query: "SELECT sector, SUM(qty * live_price) AS sector_value FROM portfolio.holdings JOIN scores.stage_snapshots ON portfolio.holdings.symbol = scores.stage_snapshots.symbol WHERE snapshot_date >= CURRENT_DATE - INTERVAL '5 days' GROUP BY sector;"
  trim_candidates:
    description: "Identify potential candidates for trimming positions."
