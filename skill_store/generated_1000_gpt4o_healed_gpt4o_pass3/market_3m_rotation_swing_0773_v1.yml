    query: "SELECT index_symbol, (MAX(close)/MIN(close) - 1) * 100 as change_pct FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY index_symbol;"
  -
    description: "Identify changes in distribution of market stages"
    query: "WITH recent_stages AS (SELECT stage, COUNT(*) as count FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY stage) SELECT * FROM recent_stages;"
  -
    description: "Identify leading sectors in Stage 2"
    query: "SELECT sector, COUNT(*) as count FROM scores.stage2_vcp_picks WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector ORDER BY count DESC LIMIT 5;"
