  sector_exposure: "SELECT s.sector, SUM(h.qty * s.live_price) AS total_value FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY s.sector;"
