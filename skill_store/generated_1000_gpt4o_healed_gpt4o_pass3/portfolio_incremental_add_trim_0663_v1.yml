  portfolio_state: "SELECT h.symbol, h.qty, h.avg_cost, s.live_price, s.stage_score FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND s.price_date = (SELECT MAX(price_date) FROM scores.stage_snapshots);"
