  identify_add_trim_candidates:
    description: "Identify symbols to add or trim based on performance and stage."
    query: "WITH recent_performance AS (SELECT symbol, AVG(change_1m_pct) AS avg_change, MAX(stage) AS current_stage FROM scores.stage_snapshots WHERE snapshot_date >= NOW() - INTERVAL '20 DAYS' GROUP BY symbol) SELECT rp.symbol, rp.avg_change, rp.current_stage, p.qty FROM recent_performance rp JOIN portfolio.holdings p ON rp.symbol = p.symbol WHERE rp.avg_change > 0.05 AND rp.current_stage > 2;"
