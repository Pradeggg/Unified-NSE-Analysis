sql_templates:
  portfolio_state:
    template: "SELECT h.symbol, h.qty, h.avg_cost, s.stage, s.trading_signal, s.change_1d_pct, s.change_1w_pct FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
    description: "Fetch the current state of the portfolio with the latest stage and signal context."
  add_candidates:
    template: "SELECT s.symbol, s.company_name, s.sector, s.trading_signal FROM scores.stage_snapshots s WHERE s.trading_signal IN ('BUY', 'STRONG_BUY') AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 10;"
    description: "Fetch candidates for adding based on a BUY or STRONG_BUY signal."
  trim_candidates:
    template: "SELECT s.symbol, s.company_name, s.sector, s.trading_signal FROM scores.stage_snapshots s WHERE s.trading_signal = 'SELL' AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 10;"
    description: "Fetch candidates for trimming based on SELL signal."
  sector_exposure:
    template: "SELECT s.sector, COUNT(h.symbol) as count FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY s.sector;"
    description: "Summarize the sector exposure based on current holdings."
  risk_flags:
    template: "SELECT s.symbol, s.rsi, s.trend_signal FROM scores.stage_snapshots s WHERE s.rsi > 70 OR s.trend_signal = 'BEARISH' AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
    description: "Identify risk flags such as high RSI or bearish trend signals."
