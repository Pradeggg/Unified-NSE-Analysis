sql_templates:
  -
    name: "SectorBreadthAnalysis"
    template: "WITH TopSectors AS (SELECT sector, AVG(pct_above_50dma) AS avg_pct_above FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) GROUP BY sector ORDER BY avg_pct_above DESC LIMIT 5), Stage2Participation AS (SELECT sector, AVG(stage2_pct) AS avg_stage2 FROM breadth.ma_pct_above WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.ma_pct_above) GROUP BY sector ORDER BY avg_stage2 DESC LIMIT 5) SELECT ts.sector, ts.avg_pct_above, s2p.avg_stage2 FROM TopSectors ts JOIN Stage2Participation s2p ON ts.sector = s2p.sector;"
  -
    name: "CandidateSymbols"
    template: "SELECT symbol, company_name, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND trading_signal IN ('BUY', 'STRONG_BUY') AND sector IN (SELECT sector FROM SectorBreadthAnalysis);"
  -
    name: "EODData"
    template: "SELECT eod.symbol, eod.close, eod.volume FROM market.equity_eod eod JOIN CandidateSymbols cs ON eod.symbol = cs.symbol WHERE eod.trade_date = (SELECT MAX(trade_date) FROM market.equity_eod);"
