    template: "WITH latest_stages AS (SELECT symbol, fundamental_score, trading_signal, max(snapshot_date) as snapshot_date\nFROM scores.stage_snapshots\nWHERE stage = 'STAGE_2' AND trading_signal IN ('BUY', 'STRONG_BUY')\nGROUP BY symbol, fundamental_score, trading_signal),\nlatest_vcp AS (SELECT symbol, vcp_score, vcp_breakout_pct, max(snapshot_date) as snapshot_date\nFROM scores.stage2_vcp_picks\nGROUP BY symbol, vcp_score, vcp_breakout_pct),\nlatest_eod AS (SELECT symbol, high, turnover_cr\nFROM market.equity_eod\nWHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod))\nSELECT ls.symbol\nFROM latest_stages ls\nJOIN latest_vcp lv ON ls.symbol = lv.symbol\nJOIN latest_eod le ON ls.symbol = le.symbol\nWHERE le.turnover_cr > 5\nORDER BY lv.vcp_score DESC, ls.fundamental_score DESC\nLIMIT 50;"
