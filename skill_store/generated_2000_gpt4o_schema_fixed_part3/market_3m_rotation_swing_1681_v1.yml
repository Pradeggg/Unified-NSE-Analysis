    sql: "SELECT sector, COUNT(*) AS sector_count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector ORDER BY sector_count DESC LIMIT 5;"
