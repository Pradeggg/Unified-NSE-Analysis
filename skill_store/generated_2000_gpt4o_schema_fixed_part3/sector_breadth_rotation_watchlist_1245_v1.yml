  improving_sectors: "SELECT DISTINCT sd.sector FROM breadth.sector_daily sd JOIN scores.stage_snapshots ss ON sd.sector = ss.sector WHERE sd.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' ORDER BY sd.snapshot_date DESC LIMIT 5;"
  candidate_symbols: "WITH latest_eod AS (SELECT * FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND series = 'EQ') SELECT ss.symbol, ss.company_name, ss.change_1m_pct, ss.stage_score, ss.relative_strength FROM scores.stage_snapshots ss JOIN latest_eod eod ON ss.symbol = eod.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY ss.stage_score DESC, ss.relative_strength DESC LIMIT 20;"
