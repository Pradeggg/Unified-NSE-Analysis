    template: "WITH latest_stage AS (SELECT symbol, stage, technical_score FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), insider_alerts_filtered AS (SELECT symbol, alert_date, qty, value_cr, insider_score FROM signals.insider_alerts WHERE alert_date >= CURRENT_DATE - INTERVAL '20 days'), bulk_deals_filtered AS (SELECT symbol, deal_date, qty, price FROM signals.bulk_block_deals WHERE deal_date >= CURRENT_DATE - INTERVAL '20 days') SELECT i.symbol, i.alert_date, b.deal_date, i.qty AS insider_qty, b.qty AS bulk_qty, i.value_cr, b.price, l.stage, l.technical_score FROM insider_alerts_filtered i JOIN bulk_deals_filtered b ON i.symbol = b.symbol JOIN latest_stage l ON i.symbol = l.symbol ORDER BY i.alert_date DESC, b.deal_date DESC LIMIT 100;"
