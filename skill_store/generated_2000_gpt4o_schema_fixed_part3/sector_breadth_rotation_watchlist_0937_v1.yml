sql_templates:
  sector_breadth_query: "WITH latest_breadth AS (\n    SELECT sector, avg(pct_above_50dma) AS avg_pct_above_50dma,\n           avg(change_5d) AS avg_change_5d\n    FROM breadth.sector_daily\n    WHERE snapshot_date >= (CURRENT_DATE - INTERVAL '20 days')\n    GROUP BY sector\n),\nlatest_stages AS (\n    SELECT sector, count(*) FILTER (WHERE stage = 'STAGE_2') AS stage2_count,\n           count(*) AS total_count\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n    GROUP BY sector\n)\nSELECT lb.sector, lb.avg_pct_above_50dma, lb.avg_change_5d,\n       ls.stage2_count, ls.total_count,\n       (ls.stage2_count::decimal / ls.total_count) AS stage2_pct\nFROM latest_breadth lb\nJOIN latest_stages ls ON lb.sector = ls.sector\nORDER BY stage2_pct DESC;"
  candidate_symbols_query: "SELECT symbol, company_name, relative_strength, stage_score\nFROM scores.stage_snapshots\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n  AND stage = 'STAGE_2'\n  AND trading_signal IN ('BUY', 'STRONG_BUY')\nORDER BY relative_strength DESC\nLIMIT 10;"
