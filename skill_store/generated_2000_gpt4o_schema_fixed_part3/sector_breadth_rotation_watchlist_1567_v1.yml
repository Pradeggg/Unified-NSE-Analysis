    description: "Rank sectors by recent breadth improvement and stage 2 participation."
    sql:
      - "WITH latest_sector_breadth AS ("
      - "  SELECT sector, index_name, pct_above_50dma, stage2_pct "
      - "  FROM breadth.sector_daily "
      - "  JOIN breadth.ma_pct_above "
      - "  ON breadth.sector_daily.snapshot_date = breadth.ma_pct_above.snapshot_date "
      - "  WHERE breadth.sector_daily.snapshot_date = ("
      - "    SELECT MAX(snapshot_date) FROM breadth.sector_daily"
      - "  )"
      - "), "
      - "ranked_sectors AS ("
      - "  SELECT sector, "
      - "  AVG(pct_above_50dma) AS avg_pct_above_50dma, "
      - "  AVG(stage2_pct) AS avg_stage2_pct "
      - "  FROM latest_sector_breadth "
      - "  GROUP BY sector "
      - "  ORDER BY avg_pct_above_50dma DESC, avg_stage2_pct DESC "
      - "  LIMIT 10"
      - ") "
      - "SELECT * FROM ranked_sectors;"
