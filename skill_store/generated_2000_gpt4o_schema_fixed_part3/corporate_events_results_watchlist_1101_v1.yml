    name: "get_upcoming_events"
    query: "SELECT ce.symbol, ce.event_type, ce.event_date, ce.purpose_raw, ce.detail, ce.source FROM signals.corporate_events ce WHERE ce.event_date = CURRENT_DATE AND ce.event_type IN ('RESULTS', 'DIVIDEND', 'SPLIT', 'BONUS', 'AGM') ORDER BY ce.event_date LIMIT 10;"
  -
    name: "get_latest_results_analysis"
    query: "SELECT DISTINCT ON (ra.symbol) ra.symbol, ra.company_name, ra.industry, ra.period_end, ra.verdict, ra.growth_yoy_revenue_pct, ra.growth_qoq_revenue_pct, ra.pl_commentary FROM scores.results_analysis ra WHERE ra.period_end = (SELECT MAX(period_end) FROM scores.results_analysis) ORDER BY ra.symbol, ra.period_end DESC NULLS LAST LIMIT 10;"
  -
    name: "combine_event_stage"
    query: "SELECT ce.symbol, ce.event_type, ce.event_date, ss.stage, ss.stage_score FROM signals.corporate_events ce JOIN scores.stage_snapshots ss ON ce.symbol = ss.symbol WHERE ce.event_date = CURRENT_DATE AND ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) ORDER BY ss.stage_score DESC LIMIT 10;"
