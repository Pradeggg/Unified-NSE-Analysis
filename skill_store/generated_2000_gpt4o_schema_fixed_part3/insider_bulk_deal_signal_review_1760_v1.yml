sql_templates:
  -
    description: "Retrieve the latest insider alerts and bulk deals with technical confirmation for stage 2 buy signals."
    sql: "WITH latest_stage AS (\n    SELECT symbol, stage, trading_signal\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n      AND trading_signal IN ('BUY', 'STRONG_BUY')\n),\nlatest_insider_alerts AS (\n    SELECT symbol, entity, alert_date, qty, value_cr, insider_score\n    FROM signals.insider_alerts\n    WHERE alert_date >= (CURRENT_DATE - INTERVAL '3 months')\n),\nlatest_bulk_deals AS (\n    SELECT symbol, entity, deal_date, qty, price\n    FROM signals.bulk_block_deals\n    WHERE deal_date >= (CURRENT_DATE - INTERVAL '3 months')\n)\nSELECT \n    a.symbol, \n    a.entity AS insider_entity, \n    a.qty AS insider_qty, \n    a.value_cr AS insider_value_cr, \n    a.insider_score, \n    b.entity AS bulk_entity, \n    b.qty AS bulk_qty, \n    b.price AS bulk_price\nFROM \n    latest_insider_alerts a\nJOIN \n    latest_bulk_deals b ON a.symbol = b.symbol\nJOIN \n    latest_stage c ON a.symbol = c.symbol\nORDER BY \n    a.symbol, a.alert_date DESC\nLIMIT 100;"
