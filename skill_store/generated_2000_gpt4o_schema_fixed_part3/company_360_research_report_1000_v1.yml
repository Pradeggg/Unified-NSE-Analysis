    query: "SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND symbol = $1;"
  -
    name: "recent_financial_results"
    query: "WITH latest_quarter AS (SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = $1 ORDER BY period_end DESC NULLS LAST, fetched_at DESC), latest_annual AS (SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE symbol = $1 ORDER BY period_end DESC NULLS LAST, fetched_at DESC) SELECT * FROM latest_quarter UNION ALL SELECT * FROM latest_annual;"
