sql_templates:
  -
    template_name: "sector_leaderboard"
    description: "Ranks sectors by performance metrics."
    sql:
      - "WITH latest_breadth AS ("
      - "    SELECT sector, pct_above_50dma AS pct_50dma, change_5d AS change_5d, breadth_signal"
      - "    FROM breadth.sector_daily"
      - "    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)"
      - "),"
      - "stage_2_sectors AS ("
      - "    SELECT sector, COUNT(*) as stage_2_count"
      - "    FROM scores.stage_snapshots"
      - "    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)"
      - "    AND stage = 'STAGE_2'"
      - "    GROUP BY sector"
      - ")"
      - "SELECT lb.sector, lb.pct_50dma, lb.change_5d, lb.breadth_signal, COALESCE(s2.stage_2_count, 0) as stage_2_count"
      - "FROM latest_breadth lb"
      - "LEFT JOIN stage_2_sectors s2 ON lb.sector = s2.sector"
      - "ORDER BY lb.change_5d DESC, s2.stage_2_count DESC"
      - "LIMIT 10"
