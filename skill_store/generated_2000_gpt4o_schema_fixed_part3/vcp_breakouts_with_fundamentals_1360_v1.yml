  template: "WITH latest_eod AS (\n    SELECT *\n    FROM market.equity_eod\n    WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)\n        AND series = 'EQ'\n),\nlatest_stage_snapshots AS (\n    SELECT *\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n    AND (trading_signal IN ('BUY', 'STRONG_BUY'))\n),\nlatest_vcp_picks AS (\n    SELECT *\n    FROM scores.stage2_vcp_picks\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)\n)\nSELECT le.symbol, le.close, ls.stage, lv.vcp_score, lv.enhanced_fund_score\nFROM latest_eod le\nJOIN latest_stage_snapshots ls ON le.symbol = ls.symbol\nJOIN latest_vcp_picks lv ON le.symbol = lv.symbol\nORDER BY lv.vcp_score DESC, lv.enhanced_fund_score DESC\nLIMIT 100;"
