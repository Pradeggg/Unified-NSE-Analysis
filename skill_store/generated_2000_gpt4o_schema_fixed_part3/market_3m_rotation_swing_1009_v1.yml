  -
    description: "Get index returns over the last 3 months."
    template: "SELECT index_symbol, (MAX(close) - MIN(close)) / MIN(close) * 100 AS return_3m FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY index_symbol;"
  -
    description: "Determine stage distribution change between now and 3 months ago."
    template: "SELECT stage, COUNT(symbol) AS count FROM scores.stage_snapshots WHERE snapshot_date IN ((SELECT MAX(snapshot_date) FROM scores.stage_snapshots), (SELECT MAX(snapshot_date) FROM scores.stage_snapshots WHERE snapshot_date <= CURRENT_DATE - INTERVAL '3 months')) GROUP BY stage;"
  -
    description: "Identify leading sectors based on relative strength metrics."
    template: "SELECT sector, AVG(relative_strength) AS avg_strength FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_strength DESC LIMIT 5;"
  -
    description: "List primary stage 2 candidates with buy signals."
    template: "SELECT symbol, price, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' AND trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY stage_score DESC LIMIT 10;"
  -
    description: "Identify potential risks based on VCP breakout."
    template: "SELECT symbol, vcp_score, vcp_breakout_pct FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) AND vcp_breakout_pct < 0 ORDER BY vcp_breakout_pct ASC LIMIT 5;"
