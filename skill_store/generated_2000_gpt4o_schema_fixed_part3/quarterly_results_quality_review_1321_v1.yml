    template: "WITH latest_results AS (\n    SELECT DISTINCT ON (symbol) \n        symbol, period_end, period_label, revenue, pat\n    FROM scores.quarterly_results\n    WHERE period_type = 'quarter'\n    ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC\n), latest_analysis AS (\n    SELECT DISTINCT ON (symbol) \n        symbol, period_end, period_label, verdict, key_risks\n    FROM scores.results_analysis\n    ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC\n)\nSELECT lr.symbol, lr.period_label, lr.revenue, lr.pat, la.verdict, la.key_risks\nFROM latest_results lr\nJOIN latest_analysis la ON lr.symbol = la.symbol AND lr.period_end = la.period_end\nORDER BY la.verdict DESC\nLIMIT 10;"
