  join_query: "SELECT events.symbol, events.event_date, events.event_type, events.purpose_raw, ra.verdict, ra.score, ss.stage, ss.trading_signal FROM (SELECT symbol, event_type, event_date, purpose_raw, source FROM signals.corporate_events WHERE event_date >= CURRENT_DATE - INTERVAL '20 days' AND event_type IN ('RESULTS', 'DIVIDEND', 'SPLIT', 'BONUS', 'AGM')) AS events LEFT JOIN (SELECT DISTINCT ON (symbol) symbol, verdict, score FROM scores.results_analysis ORDER BY symbol, period_end DESC NULLS LAST, updated_at DESC) AS ra ON events.symbol = ra.symbol LEFT JOIN (SELECT symbol, stage, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) AS ss ON events.symbol = ss.symbol;"
