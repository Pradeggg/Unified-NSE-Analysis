  sector_relative_comparison: "WITH latest_stage AS (SELECT snapshot_date, symbol, sector FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT qr.symbol, qr.revenue, qr.pat, ss.sector FROM scores.quarterly_results qr JOIN latest_stage ss ON qr.symbol = ss.symbol WHERE qr.period_type = 'quarter' ORDER BY ss.sector, qr.pat DESC LIMIT 10;"
