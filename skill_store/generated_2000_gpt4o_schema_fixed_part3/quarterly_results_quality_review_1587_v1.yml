      name: "stage_snapshot_analysis"
      template: "SELECT a.symbol, a.revenue, a.pat, c.stage, c.trading_signal FROM scores.quarterly_results a JOIN scores.stage_snapshots c ON a.symbol = c.symbol WHERE c.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND c.trading_signal IN ('BUY', 'STRONG_BUY')"
