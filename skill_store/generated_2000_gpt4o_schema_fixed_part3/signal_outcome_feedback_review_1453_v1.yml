sql_templates:
  -
    description: "Fetch signal outcomes for the current quarter."
    query: "\n            WITH latest_date AS (\n                SELECT MAX(date_resolved) AS max_date\n                FROM signals.signal_log\n            ),\n            quarter_signals AS (\n                SELECT *\n                FROM signals.signal_log\n                WHERE date_resolved BETWEEN (CURRENT_DATE - INTERVAL '3 months') AND (SELECT max_date FROM latest_date)\n            )\n            SELECT \n                symbol, \n                signal, \n                hit_target, \n                hit_stop, \n                return_pct\n            FROM quarter_signals\n            WHERE date_resolved IS NOT NULL;\n            "
  -
    description: "Join signal logs with stage snapshots to evaluate current scores."
    query: "\n            SELECT \n                sl.symbol, \n                sl.signal, \n                sl.return_pct, \n                ss.stage, \n                ss.technical_score, \n                ss.investment_score\n            FROM signals.signal_log sl\n            JOIN scores.stage_snapshots ss ON sl.symbol = ss.symbol\n            WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n            AND sl.date_resolved IS NOT NULL;\n            "
