    description: "Compile FII/DII flow, regime history, market breadth, and index confirmation for the last 20 sessions."
    sql: "WITH latest_flows AS (\n    SELECT trade_date, fii_net_today, dii_net_today, fii_trend, dii_trend, flow_signal\n    FROM signals.fii_dii_flows\n    WHERE trade_date > CURRENT_DATE - INTERVAL '20 days'\n), latest_regime AS (\n    SELECT trade_date, regime, confidence, days_in_regime\n    FROM signals.regime_history\n    WHERE trade_date > CURRENT_DATE - INTERVAL '20 days'\n), latest_breadth AS (\n    SELECT trade_date, advances, declines, net_ad, ad_signal, trin, market_sentiment\n    FROM breadth.market_daily\n    WHERE trade_date > CURRENT_DATE - INTERVAL '20 days'\n), latest_index AS (\n    SELECT trade_date, index_symbol, close, change_pct, trend_signal\n    FROM market.index_eod\n    WHERE trade_date > CURRENT_DATE - INTERVAL '20 days' AND index_symbol = 'Nifty 50'\n)\nSELECT \n    f.trade_date,\n    f.fii_net_today, f.dii_net_today, f.fii_trend, f.dii_trend, f.flow_signal,\n    r.regime, r.confidence, r.days_in_regime,\n    b.advances, b.declines, b.net_ad, b.ad_signal, b.trin, b.market_sentiment,\n    i.close, i.change_pct, i.trend_signal\nFROM latest_flows f\nJOIN latest_regime r ON f.trade_date = r.trade_date\nJOIN latest_breadth b ON f.trade_date = b.trade_date\nJOIN latest_index i ON f.trade_date = i.trade_date"
