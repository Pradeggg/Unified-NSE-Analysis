    template_name: "fii_dii_regime_breadth_review_query"
    description: "Collect data for FII/DII flows, market regime, breadth, and index for last 5 sessions."
    sql_statement: "WITH latest_dates AS (SELECT trade_date FROM signals.fii_dii_flows ORDER BY trade_date DESC LIMIT 5), \n\nfii_dii_data AS (SELECT f.trade_date, f.fii_net_today, f.dii_net_today, f.fii_trend, f.dii_trend, f.flow_signal \n                 FROM signals.fii_dii_flows f \n                 INNER JOIN latest_dates ld ON f.trade_date = ld.trade_date), \n\nregime_data AS (SELECT r.trade_date, r.regime, r.confidence \n                FROM signals.regime_history r \n                INNER JOIN latest_dates ld ON r.trade_date = ld.trade_date), \n\nbreadth_data AS (SELECT b.trade_date, b.net_ad, b.ad_signal, b.trin_signal \n                 FROM breadth.market_daily b \n                 INNER JOIN latest_dates ld ON b.trade_date = ld.trade_date), \n\nindex_data AS (SELECT i.trade_date, i.close, i.trend_signal \n               FROM market.index_eod i \n               INNER JOIN latest_dates ld ON i.trade_date = ld.trade_date \n               WHERE i.index_symbol = 'NIFTY 50')\n\nSELECT fd.trade_date, fd.fii_net_today, fd.dii_net_today, fd.fii_trend, fd.dii_trend, fd.flow_signal, \n       rd.regime, rd.confidence, \n       bd.net_ad, bd.ad_signal, bd.trin_signal, \n       id.close as nifty_close, id.trend_signal \nFROM fii_dii_data fd \nINNER JOIN regime_data rd ON fd.trade_date = rd.trade_date \nINNER JOIN breadth_data bd ON fd.trade_date = bd.trade_date \nINNER JOIN index_data id ON fd.trade_date = id.trade_date \nORDER BY fd.trade_date DESC;"
