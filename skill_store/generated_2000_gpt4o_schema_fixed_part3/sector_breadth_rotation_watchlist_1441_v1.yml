  -
    description: "Retrieve sectors with the best breadth improvement over the last 3 months."
    sql: "SELECT sector, AVG(change_5d) AS avg_change_5d, AVG(pct_above_50dma::numeric) AS avg_breadth FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector ORDER BY avg_change_5d DESC LIMIT 10;"
