    description: "Identify stocks within improving sectors that are in Stage 2 with a strong buy signal."
    sql: "WITH improving_sectors AS (SELECT sector FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' AND breadth_signal = 'improved' GROUP BY sector) SELECT symbol, company_name FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' AND trading_signal = 'STRONG_BUY' AND sector IN (SELECT sector FROM improving_sectors);"
