    sql: "WITH latest_eod AS (SELECT * FROM market.equity_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) AND series = 'EQ'), latest_snapshots AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), latest_vcp AS (SELECT * FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)) SELECT eod.symbol, eod.close, ss.company_name, ss.sector, ss.enhanced_fund_score, vcp.vcp_score FROM latest_eod eod JOIN latest_snapshots ss ON eod.symbol = ss.symbol JOIN latest_vcp vcp ON eod.symbol = vcp.symbol WHERE ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY vcp.vcp_score DESC LIMIT 10;"
