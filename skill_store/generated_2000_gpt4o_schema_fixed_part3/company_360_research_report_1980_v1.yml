sql_templates:
  -
    template_name: "Latest_Stage_Snapshot"
    select:
      - "snapshot_date"
      - "symbol"
      - "company_name"
      - "price"
      - "stage"
      - "stage_score"
      - "technical_score"
    from: "scores.stage_snapshots"
    where: "snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND symbol = '{{symbol}}'"
    limit: 1
  -
    template_name: "Latest_Financial_Results"
    with: "latest_quarterly AS (SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE period_type = 'quarter' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC), latest_annual AS (SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE period_type = 'annual' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC)"
    select:
      - "latest_quarterly.period_label AS latest_quarter"
      - "latest_quarterly.revenue"
      - "latest_quarterly.operating_profit"
      - "latest_quarterly.pat"
      - "latest_annual.period_label AS latest_annual"
      - "latest_annual.revenue AS annual_revenue"
      - "latest_annual.operating_profit AS annual_operating_profit"
      - "latest_annual.pat AS annual_pat"
    from: "latest_quarterly"
    join:
      -
        table: "latest_annual"
        on: "latest_quarterly.symbol = latest_annual.symbol"
    where: "latest_quarterly.symbol = '{{symbol}}'"
