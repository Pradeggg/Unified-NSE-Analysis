    sql: "WITH latest_data AS (\n    SELECT\n        f.trade_date,\n        f.fii_net_today, f.dii_net_today,\n        f.flow_signal, f.fii_trend, f.dii_trend,\n        r.regime, r.confidence,\n        b.advances, b.declines, b.total_stocks,\n        b.ad_signal,\n        m.index_symbol, m.close, m.trend_signal\n    FROM\n        signals.fii_dii_flows f\n    JOIN\n        signals.regime_history r ON \n        f.trade_date = r.trade_date\n    JOIN\n        breadth.market_daily b ON\n        f.trade_date = b.trade_date\n    JOIN\n        market.index_eod m ON\n        f.trade_date = m.trade_date\n    WHERE\n        m.index_symbol = 'Nifty 50' AND\n        f.trade_date = (SELECT MAX(trade_date) FROM market.index_eod)\n)\nSELECT\n    regime,\n    CASE\n        WHEN fii_net_today > 0 AND dii_net_today > 0 THEN 'Positive Flows'\n        ELSE 'Negative Flows'\n    END as flow_context,\n    CASE\n        WHEN advances > declines THEN 'Broad Advances'\n        ELSE 'Broad Declines'\n    END as breadth_context,\n    trend_signal as index_confirmation,\n    CASE\n        WHEN regime = 'BULL' AND flow_signal = 'BULLISH' THEN 'Risk-On'\n        ELSE 'Risk-Off'\n    END as risk_flags\nFROM\n    latest_data;"
