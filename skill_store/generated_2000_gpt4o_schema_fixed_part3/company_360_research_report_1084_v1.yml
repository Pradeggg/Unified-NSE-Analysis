      sql_template: "WITH latest_quarter AS ( SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE period_type = 'quarter' AND symbol = 'RELIANCE' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC ) SELECT * FROM latest_quarter;"
