sql_templates:
  -
    description: "Extract the latest insider alerts with positive technical indicators."
    query: "WITH latest_snapshots AS (SELECT symbol, trading_signal FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), insider_alerts AS (SELECT symbol, alert_date, qty, value_cr FROM signals.insider_alerts WHERE alert_date >= CURRENT_DATE - INTERVAL '5 days') SELECT ia.symbol, SUM(ia.qty) AS total_qty, SUM(ia.value_cr) AS total_value FROM insider_alerts ia JOIN latest_snapshots ls ON ia.symbol = ls.symbol WHERE ls.trading_signal IN ('BUY', 'STRONG_BUY') GROUP BY ia.symbol ORDER BY total_value DESC LIMIT 10;"
  -
    description: "Find bulk and block deals with related stage and performance context."
    query: "WITH latest_stages AS (SELECT symbol, stage, stage_score FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)), bulk_deals AS (SELECT symbol, deal_date, qty, price FROM signals.bulk_block_deals WHERE deal_date >= CURRENT_DATE - INTERVAL '5 days') SELECT bd.symbol, bd.qty, bd.price, ls.stage, ls.stage_score FROM bulk_deals bd JOIN latest_stages ls ON bd.symbol = ls.symbol ORDER BY bd.deal_date DESC LIMIT 20;"
