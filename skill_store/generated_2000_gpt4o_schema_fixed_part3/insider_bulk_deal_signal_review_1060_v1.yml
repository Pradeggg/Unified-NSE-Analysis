    sql: "WITH latest_insider_alerts AS (\n    SELECT symbol, MAX(alert_date) AS latest_alert_date\n    FROM signals.insider_alerts\n    WHERE alert_date >= CURRENT_DATE - INTERVAL '3 months'\n    GROUP BY symbol\n), latest_bulk_deals AS (\n    SELECT symbol, MAX(deal_date) AS latest_deal_date\n    FROM signals.bulk_block_deals\n    WHERE deal_date >= CURRENT_DATE - INTERVAL '3 months'\n    GROUP BY symbol\n), latest_technicals AS (\n    SELECT symbol, snapshot_date, stage_score, technical_score\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n)\nSELECT ia.symbol, ia.latest_alert_date, bd.latest_deal_date, ss.stage_score, ss.technical_score\nFROM latest_insider_alerts ia\nJOIN latest_bulk_deals bd ON ia.symbol = bd.symbol\nJOIN latest_technicals ss ON ia.symbol = ss.symbol\nWHERE ss.technical_score > 0\nORDER BY ss.technical_score DESC\nLIMIT 10;"
