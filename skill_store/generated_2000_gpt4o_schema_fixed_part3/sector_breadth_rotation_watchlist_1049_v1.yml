    sql: "WITH recent_breadth AS (SELECT sector, AVG(pct_above_50dma::numeric) AS avg_pct_above_50dma, AVG(change_5d::numeric) AS avg_change_5d FROM breadth.sector_daily WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector), recent_stage AS (SELECT sector, COUNT(*) AS stage2_count FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY sector) SELECT rb.sector, rb.avg_pct_above_50dma, rb.avg_change_5d, rs.stage2_count FROM recent_breadth rb JOIN recent_stage rs ON rb.sector = rs.sector ORDER BY stage2_count DESC, avg_pct_above_50dma DESC LIMIT 5;"
