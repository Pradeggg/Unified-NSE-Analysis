    description: "Select insider alerts and bulk deals with technical confirmation."
    query: "WITH latest_stage_snapshots AS (\n    SELECT symbol, stage, trading_signal, snapshot_date\n    FROM scores.stage_snapshots\n    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)\n      AND trading_signal IN ('BUY', 'STRONG_BUY')\n),\ninsider_alerts AS (\n    SELECT symbol, entity, qty, value_cr, insider_score, alert_date\n    FROM signals.insider_alerts\n    WHERE alert_date = CURRENT_DATE\n),\nbulk_deals AS (\n    SELECT symbol, qty, deal_type, deal_date\n    FROM signals.bulk_block_deals\n    WHERE deal_date = CURRENT_DATE\n)\nSELECT la.symbol, la.entity, la.qty AS insider_qty, la.value_cr, bd.qty AS bulk_qty, ls.stage, ls.trading_signal\nFROM latest_stage_snapshots ls\nJOIN insider_alerts la ON la.symbol = ls.symbol\nJOIN bulk_deals bd ON bd.symbol = ls.symbol\nLIMIT 10;"
