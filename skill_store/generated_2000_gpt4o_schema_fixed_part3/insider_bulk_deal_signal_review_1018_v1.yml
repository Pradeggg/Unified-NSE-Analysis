    template: "WITH latest_insider_alerts AS (SELECT symbol, MAX(alert_date) AS max_alert_date FROM signals.insider_alerts GROUP BY symbol),\nlatest_bulk_deals AS (SELECT symbol, MAX(deal_date) AS max_deal_date FROM signals.bulk_block_deals GROUP BY symbol) \nSELECT ia.symbol, ia.alert_type, ia.qty, ia.value_cr, bd.side, bd.qty AS deal_qty, bd.price, ss.technical_score \nFROM signals.insider_alerts ia \nJOIN latest_insider_alerts lia ON ia.symbol = lia.symbol AND ia.alert_date = lia.max_alert_date \nJOIN signals.bulk_block_deals bd ON ia.symbol = bd.symbol \nJOIN latest_bulk_deals lbd ON bd.symbol = lbd.symbol AND bd.deal_date = lbd.max_deal_date \nJOIN scores.stage_snapshots ss ON ia.symbol = ss.symbol \nWHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) \nAND ss.trading_signal IN ('BUY', 'STRONG_BUY') \nLIMIT 10;"
