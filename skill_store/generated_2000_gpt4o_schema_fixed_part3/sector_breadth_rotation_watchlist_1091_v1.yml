    evidence_type: "sql"
    input_table: "breadth.sector_daily"
    latest_date_column: "snapshot_date"
    sql:
      - "WITH latest_breadth AS ("
      - "  SELECT sector, breadth_signal, pct_above_50dma"
      - "  FROM breadth.sector_daily"
      - "  WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)"
      - "  AND breadth_signal = 'Positive'"
      - "  ORDER BY pct_above_50dma DESC"
      - "  LIMIT 10"
      - ")"
      - "SELECT l.sector, s.symbol, s.company_name, s.relative_strength"
      - "FROM latest_breadth l"
      - "JOIN scores.stage_snapshots s"
      - "ON l.sector = s.sector"
      - "WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)"
      - "AND s.stage = 'STAGE_2'"
      - "AND s.trading_signal IN ('BUY', 'STRONG_BUY')"
      - "ORDER BY s.relative_strength DESC"
      - "LIMIT 20;"
