  add_candidates: "SELECT symbol, company_name, stage_score, change_1m_pct FROM scores.stage_snapshots WHERE stage IN ('Advancing', 'Emerging') AND change_1m_pct > 5 ORDER BY stage_score DESC LIMIT 5;"
  holdings_review: "SELECT h.symbol, h.qty, s.sector, s.price, s.stage, s.change_1w_pct, s.stage_score FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.price_date = CURRENT_DATE;"
  sector_exposure: "WITH sector_totals AS (SELECT s.sector, SUM(h.qty * s.price) AS total_value FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.price_date = CURRENT_DATE GROUP BY s.sector) SELECT sector, total_value, total_value / (SELECT SUM(total_value) FROM sector_totals) * 100 AS exposure_pct FROM sector_totals;"
  trim_candidates: "SELECT symbol, company_name, stage_score, change_1m_pct FROM scores.stage_snapshots WHERE stage = 'Declining' AND change_1m_pct < -5 ORDER BY stage_score ASC LIMIT 5;"
