python_tools:

sql_templates:
  add_candidates: "SELECT s.symbol, s.company_name, s.trend_signal, s.stage_score FROM scores.stage_snapshots AS s WHERE s.trend_signal = 'Up' AND s.stage_score > 3 AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
  portfolio_state: "SELECT h.symbol, h.qty, h.avg_cost, s.stage, s.stage_score, s.change_1w_pct FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) ORDER BY s.change_1w_pct DESC;"
  sector_exposure: "SELECT s.sector, SUM(h.qty) as total_qty FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY s.sector ORDER BY total_qty DESC;"
  trim_candidates: "SELECT s.symbol, s.company_name, s.trend_signal, s.stage_score FROM scores.stage_snapshots AS s WHERE s.trend_signal = 'Down' AND s.stage_score < 2 AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
