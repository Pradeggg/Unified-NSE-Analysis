python_tools:

sql_templates:
  add_candidates:
    description: "Identify potential add candidates in Stage 2 not already in holdings."
    query: "SELECT symbol, company_name, stage, stage_score FROM scores.stage_snapshots WHERE stage = 'Stage 2' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND symbol NOT IN (SELECT symbol FROM portfolio.holdings);"
  portfolio_state:
    description: "Fetch current holdings with their stage and stage score."
    query: "SELECT h.symbol, h.qty, h.avg_cost, h.buy_date, s.stage, s.stage_score FROM portfolio.holdings h LEFT JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots);"
  risk_flags:
    description: "Fetch symbols with downtrend or weak trading signals."
    query: "SELECT symbol, trend_signal, trading_signal, rsi FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND (trend_signal = 'Downtrend' OR trading_signal = 'Weak');"
  sector_exposure:
    description: "Determine sector exposure percentage."
    query: "WITH sector_totals AS (SELECT s.sector, SUM(h.qty * s.live_price) AS sector_value FROM portfolio.holdings h LEFT JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY s.sector) SELECT sector, sector_value, sector_value / (SELECT SUM(sector_value) FROM sector_totals) AS exposure_pct FROM sector_totals;"
  trim_candidates:
    description: "Identify holdings that might need trimming since they are not in Stage 2."
    query: "SELECT h.symbol, h.qty, s.stage, s.stage_score FROM portfolio.holdings h LEFT JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND s.stage != 'Stage 2';"
