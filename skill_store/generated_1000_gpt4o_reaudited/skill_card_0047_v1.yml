    query: "WITH recent_performance AS (SELECT symbol, sector, AVG(change_1m_pct) AS avg_monthly_change FROM scores.stage_snapshots WHERE snapshot_date > current_date - interval '3 months' GROUP BY symbol, sector), portfolio_information AS (SELECT h.symbol, h.qty, h.avg_cost, s.sector FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT p.symbol, p.qty, p.avg_cost, rp.avg_monthly_change, rp.sector FROM portfolio_information p JOIN recent_performance rp ON p.symbol = rp.symbol ORDER BY rp.sector, rp.avg_monthly_change DESC;"
