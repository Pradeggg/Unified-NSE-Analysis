    description: "Retrieve current portfolio holdings with stage and daily change."
    query: "SELECT h.symbol, h.qty, s.company_name, s.sector, s.change_1d_pct, s.stage, s.stage_score FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = CURRENT_DATE"
  sector_exposure:
    description: "Calculate sector exposure percentages based on current holdings."
    query: "WITH sector_counts AS (SELECT s.sector, COUNT(*) as count FROM portfolio.holdings h JOIN scores.stage_snapshots s ON h.symbol = s.symbol WHERE s.snapshot_date = CURRENT_DATE GROUP BY s.sector) SELECT sector, (count * 1.0 / (SELECT COUNT(*) FROM portfolio.holdings)) * 100 AS exposure_pct FROM sector_counts"
