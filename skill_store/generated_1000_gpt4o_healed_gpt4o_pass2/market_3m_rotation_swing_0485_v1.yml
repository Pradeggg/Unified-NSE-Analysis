      query: "SELECT sector, COUNT(*) AS leading_count FROM scores.stage_snapshots WHERE stage = 2 AND snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector ORDER BY leading_count DESC;"
      query_name: "Sector_Leadership"
