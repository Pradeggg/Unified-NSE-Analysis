      description: "Retrieve current portfolio holdings with associated stage scores."
      name: "get_current_holdings"
      sql: "SELECT h.symbol, h.qty, h.avg_cost, ss.stage, ss.stage_score, ss.relative_strength FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS ss ON h.symbol = ss.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) ORDER BY ss.stage_score DESC;"
    -
      description: "Aggregate portfolio exposure by sector."
      name: "get_sector_exposure"
      sql: "SELECT ss.sector, SUM(h.qty * ss.live_price) AS total_value FROM portfolio.holdings AS h JOIN scores.stage_snapshots AS ss ON h.symbol = ss.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY ss.sector ORDER BY total_value DESC;"
