    description: "Calculate index returns for the last 5 sessions."
    name: "Index_Returns"
    query: "SELECT trade_date, index_symbol, close, (close - prev_close) / prev_close * 100 AS change_pct FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '5 day' ORDER BY trade_date DESC;"
  -
    description: "Identify leading sectors based on stage and technical scores."
    name: "Leading_Sectors"
    query: "SELECT sector, AVG(stage_score) AS avg_stage_score FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '90 day' GROUP BY sector ORDER BY avg_stage_score DESC LIMIT 5;"
  -
    description: "Fetch primary swing candidates based on VCP picks."
    name: "Primary_Candidates"
    query: "SELECT symbol, company_name, price, vcp_score FROM scores.stage2_vcp_picks WHERE snapshot_date >= CURRENT_DATE - INTERVAL '90 day' ORDER BY vcp_score DESC LIMIT 10;"
