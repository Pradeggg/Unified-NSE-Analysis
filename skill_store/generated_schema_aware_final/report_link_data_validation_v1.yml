id: "report_link_data_validation_v1"
version: 1
status: "generated"
domain: "report_qa"
title: "Enhanced Report Data Validation"
description: "Research-only Agent Adda skill for Indian market report QA. Validates enhanced report run metadata and filtered Indian equity rows for completeness, consistency, and source-trail limitations using only approved report tables."
input_patterns:
  - "review report links not working"
  - "underlying stock html files do not have data"
  - "validate generated report links and missing data"
tags:
  - "report_qa"
  - "links"
  - "html"
  - "data_validation"
  - "indian_market"
  - "research_only"
evidence_required:
  tables:
    - "report.enhanced_runs"
    - "report.enhanced_filtered_stocks"
  columns:
    report.enhanced_runs:
      - "run_id"
      - "run_ts"
      - "analysis_date"
      - "universe_size"
      - "stocks_analyzed"
      - "stocks_filtered"
      - "indices_analyzed"
      - "market_composite_score"
      - "market_sentiment"
      - "notes"
    report.enhanced_filtered_stocks:
      - "run_id"
      - "rank"
      - "symbol"
      - "score"
      - "recommendation"
      - "current_price"
      - "open_price"
      - "high_price"
      - "low_price"
      - "volume"
      - "trading_value_cr"
      - "weekly_signal"
      - "daily_signal"
      - "day_change_pct"
      - "rsi"
      - "above_50dma"
      - "above_200dma"
      - "tech_score"
      - "fund_score"
      - "rs_score"
      - "macd_signal"
      - "week52_position"
      - "volume_ratio"
      - "rs_vs_nifty500"
  evidence_gaps:
    - "No approved table or column contains generated report URLs, link targets, file paths, HTTP status, or HTML document contents, so broken link detection cannot be proven from SQL evidence."
    - "No approved table or column contains per-stock source trail URLs, scraped page text, or HTML payloads, so source trail and underlying stock HTML population checks require external non-SQL evidence."
    - "No approved table or column contains explicit exchange, instrument type, or listing status; Indian market context must be inferred only from Agent Adda report framing and approved report rows."
tool_plan_template:
  - "Clarify the target run_id if the user did not provide one; otherwise inspect the latest enhanced report runs by run_ts."
  - "Retrieve run metadata from report.enhanced_runs and verify that run_ts, analysis_date, universe_size, stocks_analyzed, stocks_filtered, market_composite_score, and market_sentiment are populated where expected."
  - "Compare report.enhanced_runs.stocks_filtered with the count of report.enhanced_filtered_stocks rows for the same run_id."
  - "Inspect filtered stock rows for missing core fields: rank, symbol, score, recommendation, current_price, volume, weekly_signal, daily_signal, tech_score, fund_score, and rs_score."
  - "Check numeric sanity for Indian equity research reporting, including non-negative prices, volume, trading_value_cr, and scores where populated."
  - "Check rank sequencing and duplicate symbol evidence for the target run_id using approved filtered stock rows."
  - "Report broken_links only as unverified or evidence-gapped unless separate non-database evidence is supplied, because approved SQL evidence does not include URLs, paths, HTTP status, or HTML bodies."
  - "Frame all outputs as research-only QA findings for Agent Adda Indian market reports, not investment advice or trading instructions."
sql_templates:
  recent_runs: "SELECT run_id, run_ts, analysis_date, universe_size, stocks_analyzed, stocks_filtered, indices_analyzed, market_composite_score, market_sentiment, notes FROM report.enhanced_runs ORDER BY run_ts DESC"
  run_metadata_by_run_id: "SELECT run_id, run_ts, analysis_date, universe_size, stocks_analyzed, stocks_filtered, indices_analyzed, market_composite_score, market_sentiment, notes FROM report.enhanced_runs WHERE run_id = :run_id"
  filtered_rows_by_run_id: "SELECT run_id, rank, symbol, score, recommendation, current_price, open_price, high_price, low_price, volume, trading_value_cr, weekly_signal, daily_signal, day_change_pct, rsi, above_50dma, above_200dma, tech_score, fund_score, rs_score, macd_signal, week52_position, volume_ratio, rs_vs_nifty500 FROM report.enhanced_filtered_stocks WHERE run_id = :run_id ORDER BY rank"
  run_row_count_reconciliation: "SELECT report.enhanced_runs.run_id, report.enhanced_runs.analysis_date, report.enhanced_runs.stocks_filtered, COUNT(report.enhanced_filtered_stocks.symbol) FROM report.enhanced_runs LEFT JOIN report.enhanced_filtered_stocks ON report.enhanced_runs.run_id = report.enhanced_filtered_stocks.run_id WHERE report.enhanced_runs.run_id = :run_id GROUP BY report.enhanced_runs.run_id, report.enhanced_runs.analysis_date, report.enhanced_runs.stocks_filtered"
  missing_core_stock_data: "SELECT run_id, rank, symbol, score, recommendation, current_price, volume, weekly_signal, daily_signal, tech_score, fund_score, rs_score FROM report.enhanced_filtered_stocks WHERE run_id = :run_id AND (rank IS NULL OR symbol IS NULL OR score IS NULL OR recommendation IS NULL OR current_price IS NULL OR volume IS NULL OR weekly_signal IS NULL OR daily_signal IS NULL OR tech_score IS NULL OR fund_score IS NULL OR rs_score IS NULL) ORDER BY rank"
  numeric_sanity_exceptions: "SELECT run_id, rank, symbol, score, current_price, open_price, high_price, low_price, volume, trading_value_cr, day_change_pct, rsi, tech_score, fund_score, rs_score, volume_ratio FROM report.enhanced_filtered_stocks WHERE run_id = :run_id AND (score < 0 OR current_price < 0 OR open_price < 0 OR high_price < 0 OR low_price < 0 OR volume < 0 OR trading_value_cr < 0 OR rsi < 0 OR rsi > 100 OR tech_score < 0 OR fund_score < 0 OR rs_score < 0 OR volume_ratio < 0) ORDER BY rank"
  duplicate_symbols: "SELECT run_id, symbol, COUNT(symbol) FROM report.enhanced_filtered_stocks WHERE run_id = :run_id GROUP BY run_id, symbol HAVING COUNT(symbol) > 1 ORDER BY symbol"
  duplicate_ranks: "SELECT run_id, rank, COUNT(rank) FROM report.enhanced_filtered_stocks WHERE run_id = :run_id GROUP BY run_id, rank HAVING COUNT(rank) > 1 ORDER BY rank"
output_contract:
  - "findings"
  - "broken_links"
  - "missing_data"
  - "remediation"
  - "verification"
validation_rules:
  - "status must remain generated."
  - "Use only evidence_required.tables and approved columns when forming SQL or evidence claims."
  - "All SQL templates must be read-only SELECT/WITH statements and must not modify data."
  - "Do not claim a report link is broken solely from approved SQL evidence, because link URLs, file paths, HTTP status, and HTML contents are not present in the approved schema."
  - "Flag link and HTML checks as evidence gaps unless non-SQL evidence is provided by the caller."
  - "Treat a mismatch between report.enhanced_runs.stocks_filtered and the count of report.enhanced_filtered_stocks rows for the run_id as a data reconciliation finding."
  - "Treat missing symbol, rank, score, recommendation, current_price, volume, weekly_signal, daily_signal, tech_score, fund_score, or rs_score as missing_data findings for filtered stock rows."
  - "Treat negative price, volume, trading_value_cr, score, tech_score, fund_score, rs_score, or volume_ratio values as numeric sanity exceptions."
  - "Treat rsi values below 0 or above 100 as numeric sanity exceptions."
  - "Treat duplicate symbol or duplicate rank values within the same run_id as report QA findings."
  - "Keep synthesis research-only and Indian-market framed; do not provide buy, sell, or hold instructions beyond describing stored recommendation values as report data."
synthesis_guidance: "{'findings': 'Summarize run-level reconciliation, row completeness, duplicate rank or symbol checks, and numeric sanity exceptions with run_id and analysis_date when available.', 'broken_links': 'State that broken link verification is not directly supported by the approved schema. If user-supplied link evidence exists, separate it from SQL-backed findings.', 'missing_data': 'List affected symbols, ranks, and missing approved fields. If many rows are affected, group by field and provide representative examples.', 'remediation': 'Recommend regenerating the affected enhanced report run, rehydrating filtered stock rows, and adding auditable report link, file path, HTTP status, and HTML content metadata to future evidence stores.', 'verification': 'Provide the exact approved-table checks used, including run metadata retrieval, row count reconciliation, missing core stock data, numeric sanity exceptions, duplicate symbols, and duplicate ranks.', 'tone': 'Use concise QA language for Agent Adda Indian market research operations and avoid investment advice.'}"
