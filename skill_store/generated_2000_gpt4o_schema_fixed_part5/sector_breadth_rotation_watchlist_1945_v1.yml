    description: "List symbols in Stage 2 with strong sector relative strength."
    template: "SELECT DISTINCT ss.symbol, ss.company_name FROM scores.stage_snapshots ss JOIN breadth.sector_daily sd ON ss.sector = sd.sector WHERE ss.stage = 'STAGE_2' AND ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND sd.snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily) AND ss.trading_signal IN ('BUY', 'STRONG_BUY') LIMIT 10;"
