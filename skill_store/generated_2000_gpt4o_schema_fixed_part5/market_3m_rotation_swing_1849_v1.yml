  index_performance:
    query: "SELECT index_symbol, (last_close/first_close - 1) * 100 AS index_returns FROM (SELECT index_symbol, FIRST_VALUE(close) OVER (PARTITION BY index_symbol ORDER BY trade_date) AS first_close, LAST_VALUE(close) OVER (PARTITION BY index_symbol ORDER BY trade_date RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_close FROM market.index_eod WHERE trade_date >= (CURRENT_DATE - INTERVAL '3 months')) AS index_data;"
    description: "Calculates index returns over the past 3 months."
  stage_distribution_change:
    query: "SELECT stage, COUNT(symbol) AS num_stocks FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2' GROUP BY stage;"
    description: "Counts the number of stocks in Stage 2 at the latest snapshot."
  leading_sectors:
    query: "SELECT sector, AVG(stage_score) AS avg_stage_score FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY sector ORDER BY avg_stage_score DESC LIMIT 5;"
    description: "Identifies the top 5 sectors with the highest average stage scores."
  primary_candidates:
    query: "SELECT symbol, company_name, trading_signal FROM scores.stage2_vcp_picks WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) ORDER BY vcp_score DESC, rank ASC LIMIT 10;"
    description: "Selects top 10 VCP candidates with the highest VCP score."
