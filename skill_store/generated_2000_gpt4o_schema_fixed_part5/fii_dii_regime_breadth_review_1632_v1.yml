    name: "Gather Market Breadth Details"
    sql: "WITH latest_breadth AS (SELECT * FROM breadth.market_daily WHERE trade_date >= CURRENT_DATE - INTERVAL '20 days') SELECT trade_date, advances, declines, market_sentiment FROM latest_breadth ORDER BY trade_date DESC;"
