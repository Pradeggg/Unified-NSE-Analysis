    name: "Retrieve Index EOD Data"
    sql: "WITH latest_index AS (SELECT * FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '20 days' AND index_symbol = 'Nifty 50') SELECT trade_date, close, change_pct, trend_signal FROM latest_index ORDER BY trade_date DESC;"
