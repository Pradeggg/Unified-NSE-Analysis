    template_description: "Selects stocks hitting new highs, VCP patterns, or breakouts with strong fundamentals."
    sql:
      - "WITH latest_stage_snapshots AS ("
      - "  SELECT *"
      - "  FROM scores.stage_snapshots"
      - "  WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)"
      - "    AND stage = 'STAGE_2'"
      - "    AND trading_signal IN ('BUY', 'STRONG_BUY')"
      - "),"
      - "latest_vcp_picks AS ("
      - "  SELECT * "
      - "  FROM scores.stage2_vcp_picks"
      - "  WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks)"
      - "  ORDER BY vcp_score DESC"
      - "  LIMIT 100"
      - ")"
      - "SELECT DISTINCT eod.symbol, eod.close, vcp.enhanced_fund_score"
      - "FROM market.equity_eod eod"
      - "JOIN latest_stage_snapshots lss ON eod.symbol = lss.symbol"
      - "JOIN latest_vcp_picks vcp ON eod.symbol = vcp.symbol"
      - "WHERE eod.trade_date = (SELECT MAX(trade_date) FROM market.equity_eod)"
      - "AND eod.close > eod.week52_high"
      - "ORDER BY eod.close DESC"
      - "LIMIT 50"
