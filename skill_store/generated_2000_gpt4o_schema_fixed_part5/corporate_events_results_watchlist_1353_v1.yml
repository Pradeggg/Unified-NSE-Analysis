    from: "signals.corporate_events ce"
    where: "ce.event_date >= CURRENT_DATE - INTERVAL '3 months'"
    orderby: "ce.event_date DESC"
    limit: 100
  -
    name: "fetch_latest_results_analysis"
    description: "Fetch latest results analysis for these symbols"
    select:
