      - "ra.company_name"
      - "ra.verdict"
      - "ra.score"
      - "ra.source_trail"
    from: "scores.results_analysis ra"
    where: "ra.created_at = (SELECT MAX(ra2.created_at) FROM scores.results_analysis ra2 WHERE ra2.symbol = ra.symbol)"
    join:
      table: "signals.corporate_events ce"
      on: "ce.symbol = ra.symbol"
    limit: 100
  -
    name: "fetch_stage_snapshots"
    description: "Fetch stage and technical context"
    select:
      - "ss.symbol"
      - "ss.stage"
      - "ss.trend_signal"
      - "ss.trading_signal"
    from: "scores.stage_snapshots ss"
    where: "ss.snapshot_date = (SELECT MAX(ss2.snapshot_date) FROM scores.stage_snapshots ss2 WHERE ss2.symbol = ss.symbol)"
    join:
      table: "signals.corporate_events ce"
      on: "ce.symbol = ss.symbol"
    limit: 100
