sql_templates:
  -
    name: "fetch_latest_snapshot"
    query: "SELECT * FROM scores.stage_snapshots WHERE symbol = '{{symbol}}' AND snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) LIMIT 1;"
  -
    name: "fetch_latest_quarterly_results"
    query: "SELECT DISTINCT ON (symbol) * FROM scores.quarterly_results WHERE symbol = '{{symbol}}' AND period_type = 'quarter' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC;"
  -
    name: "fetch_latest_annual_results"
    query: "SELECT DISTINCT ON (symbol) * FROM scores.annual_results WHERE symbol = '{{symbol}}' AND period_type = 'annual' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC;"
  -
    name: "fetch_balance_sheet_cash_flow"
    query: "SELECT * FROM scores.balance_sheet bs JOIN scores.cash_flow cf ON bs.symbol = cf.symbol AND bs.period_end = cf.period_end WHERE bs.symbol = '{{symbol}}' AND bs.period_type = 'annual' ORDER BY bs.period_end DESC LIMIT 1;"
  -
    name: "fetch_latest_eod"
    query: "SELECT * FROM market.equity_eod WHERE symbol = '{{symbol}}' AND trade_date = (SELECT MAX(trade_date) FROM market.equity_eod) LIMIT 1;"
