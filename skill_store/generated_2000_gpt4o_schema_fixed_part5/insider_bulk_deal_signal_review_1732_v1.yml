    template: "SELECT ia.symbol, ia.alert_date, ia.alert_type, ia.entity, ia.qty, ia.value_cr, ia.insider_score, ss.stage, ss.trading_signal, ss.technical_score FROM signals.insider_alerts ia JOIN (SELECT symbol, MAX(alert_date) AS max_alert_date FROM signals.insider_alerts GROUP BY symbol) latest_ia ON ia.symbol = latest_ia.symbol AND ia.alert_date = latest_ia.max_alert_date JOIN scores.stage_snapshots ss ON ia.symbol = ss.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY ia.insider_score DESC LIMIT 100;"
  -
