    template: "SELECT bbd.symbol, bbd.deal_date, bbd.deal_type, bbd.qty, bbd.price, ss.stage, ss.trading_signal, ss.technical_score FROM signals.bulk_block_deals bbd JOIN (SELECT symbol, MAX(deal_date) AS max_deal_date FROM signals.bulk_block_deals GROUP BY symbol) latest_bbd ON bbd.symbol = latest_bbd.symbol AND bbd.deal_date = latest_bbd.max_deal_date JOIN scores.stage_snapshots ss ON bbd.symbol = ss.symbol WHERE ss.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND ss.stage = 'STAGE_2' AND ss.trading_signal IN ('BUY', 'STRONG_BUY') ORDER BY bbd.deal_date DESC LIMIT 100;"
