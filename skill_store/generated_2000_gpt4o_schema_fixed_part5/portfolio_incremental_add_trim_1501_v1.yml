  add_candidates: "WITH latest_stage AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT holdings.symbol, holdings.qty, snapshots.trading_signal FROM portfolio.holdings as holdings JOIN latest_stage as snapshots ON holdings.symbol = snapshots.symbol WHERE snapshots.trading_signal IN ('BUY', 'STRONG_BUY') LIMIT 10;"
  trim_candidates: "WITH latest_stage AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT holdings.symbol, holdings.qty, snapshots.trading_signal FROM portfolio.holdings as holdings JOIN latest_stage as snapshots ON holdings.symbol = snapshots.symbol WHERE snapshots.trading_signal = 'SELL' LIMIT 10;"
  sector_exposure: "WITH latest_stage AS (SELECT * FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots)) SELECT snapshots.sector, SUM(holdings.qty * snapshots.price) as sector_value FROM portfolio.holdings AS holdings JOIN latest_stage AS snapshots ON holdings.symbol = snapshots.symbol GROUP BY snapshots.sector ORDER BY sector_value DESC;"
