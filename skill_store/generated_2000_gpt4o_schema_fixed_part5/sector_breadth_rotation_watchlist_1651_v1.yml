    name: "fetch_sector_breadth"
    template: "WITH latest_sector_data AS (SELECT * FROM breadth.sector_daily WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)), stage_2_stocks AS (SELECT symbol, sector FROM scores.stage_snapshots WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2'), sector_stage_data AS (SELECT s.sector, COUNT(s.symbol) AS stage2_count FROM latest_sector_data lsd JOIN stage_2_stocks s ON lsd.sector = s.sector GROUP BY s.sector) SELECT lsd.sector, lsd.pct_above_50dma, ssd.stage2_count FROM latest_sector_data lsd LEFT JOIN sector_stage_data ssd ON lsd.sector = ssd.sector ORDER BY ssd.stage2_count DESC LIMIT 10;"
