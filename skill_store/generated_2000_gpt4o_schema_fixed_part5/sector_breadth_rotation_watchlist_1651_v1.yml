    code: "# Define a read-only function to calculate a simple momentum score.\\ndef run(context):\\n    from datetime import timedelta\\n    # Extract inputs\\n    snapshot_date = context['snapshot_date']\\n    symbol = context['symbol']\\n    # SQL to calculate momentum\\n    sql = (\"\"\"SELECT trade_date, close FROM market.equity_eod \\n            WHERE symbol = %(symbol)s AND trade_date BETWEEN\\n            %(start_date)s AND %(end_date)s ORDER BY trade_date DESC;\"\"\")\\n    # Define time frame for momentum calculation\\n    start_date = snapshot_date - timedelta(days=90)\\n    end_date = snapshot_date\\n    # Execute SQL\\n    result_set = context.db.execute(sql, {'symbol': symbol, 'start_date': start_date, 'end_date': end_date})\\n    # Calculate momentum\\n    close_prices = [row['close'] for row in result_set]\\n    if len(close_prices) < 2:\\n        return {'momentum_score': None}\\n    momentum_score = (close_prices[0] - close_prices[-1]) / close_prices[-1]\\n    return {'momentum_score': momentum_score}"
