    description: "Rank sectors by breadth and stage 2 participation."
    sql:
      - "WITH latest_breadth AS ("
      - "    SELECT sector, pct_above_50dma, change_5d, breadth_signal"
      - "    FROM breadth.sector_daily"
      - "    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM breadth.sector_daily)"
      - "),"
      - "latest_stage AS ("
      - "    SELECT sector, COUNT(symbol) AS stage_2_count"
      - "    FROM scores.stage_snapshots"
      - "    WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) AND stage = 'STAGE_2'"
      - "    GROUP BY sector"
      - ")"
      - "SELECT lb.sector, lb.pct_above_50dma, lb.change_5d, lb.breadth_signal, ls.stage_2_count"
      - "FROM latest_breadth lb"
      - "JOIN latest_stage ls ON lb.sector = ls.sector"
      - "ORDER BY stage_2_count DESC, lb.change_5d DESC"
      - "LIMIT 10;"
