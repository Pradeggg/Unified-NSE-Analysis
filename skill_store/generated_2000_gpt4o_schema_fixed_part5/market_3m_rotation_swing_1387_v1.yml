sql_templates:
  -
    name: "index_returns"
    purpose: "Calculate index returns over the last 3 months and detect exceptions."
    sql: "WITH recent_trades AS (SELECT trade_date, index_symbol, close FROM market.index_eod WHERE trade_date >= CURRENT_DATE - INTERVAL '3 months'), latest_trade AS (SELECT MAX(trade_date) AS latest_date FROM market.index_eod) SELECT rt.index_symbol, (rt.close - lt.close) / lt.close * 100 AS return_3m FROM recent_trades rt JOIN market.index_eod lt ON rt.index_symbol = lt.index_symbol WHERE lt.trade_date = (SELECT latest_date FROM latest_trade);"
  -
    name: "stage_distribution_change"
    purpose: "Identify sector-wide changes in stage distribution over 3 months."
    sql: "SELECT sector, COUNT(CASE WHEN stage = 'STAGE_2' THEN 1 ELSE NULL END) AS stage_2_count, COUNT(*) AS total_count FROM scores.stage_snapshots WHERE snapshot_date >= CURRENT_DATE - INTERVAL '3 months' GROUP BY sector;"
  -
    name: "leading_sectors"
    purpose: "Detect leading sectors based on stage change and index performance."
    sql: "SELECT rt.sector, COUNT(*) AS stage_lead_count FROM scores.stage_snapshots rt WHERE rt.stage = 'STAGE_2' AND rt.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) GROUP BY rt.sector ORDER BY stage_lead_count DESC LIMIT 5"
  -
    name: "primary_candidates"
    purpose: "List primary swing candidates from recent sector rotation."
    sql: "SELECT vcp.symbol, vcp.company_name, vcp.sector, vcp.price, vcp.vcp_score FROM scores.stage2_vcp_picks vcp WHERE vcp.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage2_vcp_picks) ORDER BY vcp.vcp_score DESC LIMIT 10"
  -
    name: "risks"
    purpose: "Highlight risk elements from the market and sectors."
    sql: "SELECT index_symbol, momentum_50d AS risk_factor FROM market.index_eod WHERE trade_date = (SELECT MAX(trade_date) FROM market.index_eod) AND momentum_50d < 0 ORDER BY risk_factor ASC LIMIT 5"
