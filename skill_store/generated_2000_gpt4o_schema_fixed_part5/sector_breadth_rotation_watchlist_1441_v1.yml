sql_templates:
  sector_breadth_rotation: "WITH recent_sector_data AS (\n    SELECT \n        sd.sector, \n        sd.pct_above_50dma, \n        ma.stage2_pct\n    FROM breadth.sector_daily sd\n    JOIN breadth.ma_pct_above ma ON sd.snapshot_date = ma.snapshot_date\n    WHERE sd.snapshot_date >= CURRENT_DATE - INTERVAL '3 months'\n    ORDER BY sd.snapshot_date DESC\n),\nlatest_stage_data AS (\n    SELECT \n        s.symbol, \n        s.sector,\n        s.trading_signal,\n        s.stage\n    FROM scores.stage_snapshots s\n    WHERE s.snapshot_date = (SELECT MAX(snapshot_date) FROM scores.stage_snapshots) \n    AND s.stage = 'STAGE_2'\n    AND s.trading_signal IN ('BUY', 'STRONG_BUY')\n),\ncombined_data AS (\n    SELECT \n        recent_sector_data.sector,\n        AVG(recent_sector_data.pct_above_50dma) AS avg_pct_above_50dma,\n        AVG(recent_sector_data.stage2_pct) AS avg_stage2_pct\n    FROM recent_sector_data\n    GROUP BY recent_sector_data.sector\n)\nSELECT \n    cd.sector,\n    cd.avg_pct_above_50dma,\n    cd.avg_stage2_pct,\n    array_agg(lsd.symbol) as candidate_symbols\nFROM combined_data cd\nJOIN latest_stage_data lsd ON cd.sector = lsd.sector\nGROUP BY cd.sector, cd.avg_pct_above_50dma, cd.avg_stage2_pct\nORDER BY cd.avg_stage2_pct DESC\nLIMIT 5;"
