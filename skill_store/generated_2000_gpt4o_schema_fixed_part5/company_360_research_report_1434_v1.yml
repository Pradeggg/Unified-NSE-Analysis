  fetch_financial_trends:
    template: "WITH latest_quarter AS (SELECT DISTINCT ON (symbol) symbol, period_label, revenue, expenses, operating_profit FROM scores.quarterly_results WHERE symbol = $1 AND period_type = 'quarter' ORDER BY symbol, period_end DESC NULLS LAST, fetched_at DESC) SELECT * FROM latest_quarter;"
