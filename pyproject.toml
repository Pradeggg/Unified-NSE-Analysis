[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-adda-nse"
version = "0.1.0"
description = "Agent Adda Market Intelligence Agent for Indian markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0.0",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0", "ollama>=0.4.0"]
reports = ["playwright>=1.45.0", "openpyxl>=3.1.0"]
search = ["ddgs>=9.0.0", "googlesearch-python>=1.2.3"]
web = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]

[project.scripts]
agent-adda = "agent_adda.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]
