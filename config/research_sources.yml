# Curated Research Sources (v1)
#
# This file is the source of truth for feed-like sources (RSS/Atom/official feeds).
# The sync+ingest tool upserts these rows into PostgreSQL:
#   company_intel.research_sources
#
# Notes:
# - Keep sources curated and ToS-safe (prefer official RSS/Atom and press-release feeds).
# - Do not add “crawl the whole site” sources here (Phase 1 is feeds only).
# - `symbol` is optional; leave empty for market-wide feeds.
#
# Example (fill in a real feed URL):
# - source_name: "Example Markets Feed"
#   source_kind: "rss"
#   source_url: "https://example.com/markets/rss"
#   source_tier: 3
#   document_type: "news_rss"
#   symbol: ""
#   tags: { region: "IN", topics: ["markets"] }
#   is_active: false
#   notes: "Replace with a verified RSS/Atom URL."

version: 1

