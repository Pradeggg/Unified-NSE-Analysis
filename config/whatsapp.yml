# Agent Adda WhatsApp notification settings.
#
# Required for real sends:
#   enabled: true
#   dry_run: false
#   phone_number_id: "<Meta WhatsApp phone number ID>"
#   access_token: "<Meta system-user access token>"
#   default_recipients: ["919876543210"]
#
# Environment variables override this file:
#   WHATSAPP_ENABLED=true
#   WHATSAPP_DRY_RUN=false
#   WHATSAPP_PHONE_NUMBER_ID=...
#   WHATSAPP_ACCESS_TOKEN=...
#   WHATSAPP_RECIPIENTS=919876543210,919999999999

enabled: false
dry_run: true
graph_api_version: "v23.0"
phone_number_id: ""
access_token: ""
default_recipients: []

# For outbound alert notifications outside an active user conversation window,
# create and approve this template in WhatsApp Manager, then set use_template true.
use_template: false
template_name: "agent_adda_alert"
template_language: "en"
timeout_seconds: 15
