<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Adda — RELIANCE Research</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --dim: #888;
    --accent: #22d3ee;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --user-bg: #1e293b;
    --ai-bg: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; color: var(--accent); font-weight: 700; }
  .header .meta { color: var(--dim); font-size: 12px; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .message { margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .message-header { padding: 8px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .message-body { padding: 12px 16px; white-space: pre-wrap; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.7; }
  .user .message-header { background: #1e3a5f; color: #93c5fd; }
  .user .message-body { background: var(--user-bg); }
  .assistant .message-header { background: #1a3028; color: var(--green); }
  .assistant .message-body { background: var(--ai-bg); }
  .system .message-header { background: #2a1f00; color: var(--yellow); }
  .system .message-body { background: #1a1500; }
  .footer { text-align: center; padding: 32px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); margin-top: 32px; }
  .stats { display: flex; gap: 24px; padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .stat { display: flex; flex-direction: column; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--dim); text-transform: uppercase; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🤖 Agent Adda — Research Session</h1>
    <div class="meta">Session exported 08 May 2026, 01:37 IST</div>
  </div>
</div>
<div class="stats">
  <div class="stat"><span class="stat-value">2</span><span class="stat-label">Turns</span></div>
  <div class="stat"><span class="stat-value">1</span><span class="stat-label">Queries</span></div>
  <div class="stat"><span class="stat-value">01:37</span><span class="stat-label">Exported</span></div>
</div>
<div class="container">
<div class="message user">
  <div class="message-header">👤 You</div>
  <div class="message-body">What is RELIANCE doing?</div>
</div>
<div class="message assistant">
  <div class="message-header">🤖 Agent Adda</div>
  <div class="message-body">RELIANCE is trading at 1437.</div>
</div>
</div>
<div class="footer">Generated by Agent Adda · NSE Market Research Terminal · 08 May 2026</div>
</body>
</html>
